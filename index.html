<style>
/* Layout: full-bleed chart-table map, ledger strip on top, city sheet slides up from bottom */
:root{
  --sea:#d9e4e1; --land:#f3efe2; --border:#b9b29a; --ink:#1d2a2b; --muted:#5f6e6c;
  --accent:#c2410c; --own:#0f766e; --space:#c3d0cc; --panel:#fbfaf5; --line:#d6d1bf; --good:#15803d; --bad:#b91c1c; --ownbg:#fef9c3; --ownbg2:#fefce8;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --sea:#0e1a1d; --land:#1f2b2a; --border:#3c4a46; --ink:#e8ece6; --muted:#97a6a1;
  --accent:#fb923c; --own:#2dd4bf; --space:#070d0f; --panel:#141f21; --line:#2c3a38; --good:#4ade80; --bad:#f87171; --ownbg:rgba(234,179,8,.16); --ownbg2:rgba(234,179,8,.08); color-scheme:dark}}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{
  --sea:#0e1a1d; --land:#1f2b2a; --border:#3c4a46; --ink:#e8ece6; --muted:#97a6a1;
  --accent:#fb923c; --own:#2dd4bf; --space:#070d0f; --panel:#141f21; --line:#2c3a38; --good:#4ade80; --bad:#f87171; --ownbg:rgba(234,179,8,.16); --ownbg2:rgba(234,179,8,.08); color-scheme:dark}
html,body{height:100%}
body{background:var(--sea);color:var(--ink);font-family:var(--body);overflow:hidden}
#app{position:relative;height:100%;display:flex;flex-direction:column}
header{background:var(--panel);border-bottom:1px solid var(--line);padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;gap:14px;align-items:center}
.brand{margin-right:auto;min-width:0}
.brand small{display:block;font-family:var(--mono);font-size:10px;color:var(--muted);white-space:nowrap}
.brand small b{font-weight:600;color:var(--ink)}
h1{font-family:var(--display);font-weight:800;font-size:20px;margin:0;letter-spacing:-.02em;line-height:1.1}
.stat.cash b{font-size:17px}
header>*{flex:none}.brand{flex:1 1 auto}
@media (max-width:440px){header .stat.nwst{display:none}header{gap:12px}.brand small span{display:none}header .brand{min-width:0;overflow:hidden}#rank .rn{display:none}header .stat b{white-space:nowrap}header .stat.cash b{font-size:clamp(12px,3.8vw,15px)}header .stat:not(.cash) b{font-size:clamp(11px,3.3vw,15px)}}
@media (max-width:380px){header{gap:8px}}
@media (max-width:819px){body #sheet{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}}
h1 span{color:var(--accent)}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--mono);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.stat small{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
#mapwrap{position:relative;flex:1;min-height:0}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas#map:active{cursor:grabbing}
#ticker{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:10px;right:max(12px,env(safe-area-inset-right,0px));
  font-size:12px;font-family:var(--mono);color:var(--ink);display:flex;flex-direction:column;align-items:flex-start;gap:4px}
#ticker button{all:unset;cursor:pointer;background:var(--panel);padding:5px 10px;border:1px solid var(--line);border-radius:999px;max-width:100%;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 1px 3px rgba(0,0,0,.08);box-sizing:border-box}
#ticker button::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:7px;vertical-align:1px}
#bunkhud{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:44px;display:flex;flex-direction:column;align-items:flex-end;gap:4px;max-width:calc(100% - 24px);z-index:5;font-size:12px;font-family:var(--mono)}
#bunkhud button{all:unset;cursor:pointer;padding:5px 10px;border-radius:999px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-sizing:border-box;color:#fff}
#bunkhud .bk-in{background:#166534;border:1px solid #4ade80}
#bunkhud .bk-warn{background:#7f1d1d;border:1px solid #f87171;animation:bkpulse 1s infinite alternate}
@keyframes bkpulse{to{background:#b91c1c}}
#ticker div{background:var(--panel);padding:5px 10px;border:1px solid var(--line);border-radius:8px;max-width:100%;box-sizing:border-box;color:var(--muted)}
#hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted);pointer-events:none}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:58%;overflow:auto;overscroll-behavior:contain;background:var(--panel);
  border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.14);
  padding-block:0 20px;transition:transform .25s ease,max-height .25s ease;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  transform:translateY(105%)}
#sheet.open{transform:none}
#sheet.full{max-height:calc(100% - 8px)}
@media (min-width:820px){#sheet{left:auto;width:420px;top:0;max-height:none;border-radius:0;border-left:1px solid var(--line);transform:translateX(105%)}#sheet.open{transform:none}.grab{display:none!important}}
.shead{display:flex;align-items:start;gap:10px;padding-top:4px}
.shead h2{font-family:var(--display);font-size:24px;margin:0;letter-spacing:-.02em;text-wrap:balance}
.shead p{margin:2px 0 0;color:var(--muted);font-size:13px}
.x{margin-left:auto;flex:none;background:var(--line);border:0;color:var(--ink);border-radius:50%;width:32px;height:32px;font-size:18px;line-height:1;cursor:pointer}
.meta{display:flex;gap:16px;margin:10px 0 12px;font-family:var(--mono);font-size:12px}
.meta span{color:var(--muted)}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.row .n{font-weight:600}
.devname,.mdx-hd h2 span.devname{color:#ffd23f;font-weight:800;text-shadow:0 0 1px #6b4a00,0 0 2px #6b4a00,0 0 6px #ffd700,0 0 12px #ffb300;animation:devglow 2.6s ease-in-out infinite alternate}
@keyframes devglow{from{text-shadow:0 0 1px #6b4a00,0 0 2px #6b4a00,0 0 5px #ffd700,0 0 9px #ffb300}to{text-shadow:0 0 1px #6b4a00,0 0 2px #6b4a00,0 0 8px #ffe066,0 0 16px #ffb300}}
@media (prefers-reduced-motion:reduce){.devname{animation:none}}
.row .d{min-width:0;font-size:12.5px;line-height:1.45;color:var(--muted);grid-column:1}
.row .d b{font-family:var(--mono);color:var(--ink);font-weight:600}
.row button{grid-row:1/3;grid-column:2}
button.buy{font-family:var(--mono);font-weight:600;font-size:12.5px;min-height:36px;padding:7px 12px;border-radius:8px;border:1.5px solid var(--ink);background:var(--ink);color:var(--panel);cursor:pointer;min-width:96px;line-height:1.2;transition:transform .08s}
button.buy:not(:disabled):active{transform:scale(.97)}
button.buy.up{background:transparent;color:var(--ink)}
button.buy:disabled{opacity:.32;cursor:not-allowed}
button.buy.up{border-color:var(--line)}button.buy.up:not(:disabled):hover{border-color:var(--ink)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sec{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--ink);margin:22px 0 2px;display:flex;align-items:center;gap:8px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.tag{font-family:var(--mono);font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:999px;margin-left:6px;white-space:nowrap;display:inline-block;vertical-align:1px}
.tag.boom{background:var(--good);color:var(--panel)} .tag.bust{background:var(--bad);color:var(--panel)}
.foot{display:flex;gap:8px;margin-top:14px}
.foot button{font-size:12px;background:none;border:1px solid var(--line);color:var(--muted);padding:6px 10px;border-radius:4px;cursor:pointer}
#toast{position:absolute;z-index:5;left:50%;bottom:20px;border-radius:999px!important;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:4px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#sheet{transition:none}}
.ctl{display:flex;gap:6px;align-items:center;width:100%}
@media (min-width:700px){.ctl{width:auto}}
.ctl button{font-family:var(--mono);font-size:12px;font-weight:600;padding:6px 10px;border-radius:4px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.ctl button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.ctl .pf{margin-left:auto;background:var(--accent);color:var(--panel);border-color:var(--accent)}
.spark{width:100%;height:64px;display:block;margin:6px 0 2px}
.goal{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}
.goal .d{font-size:12px;color:var(--muted)}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;grid-column:1}
.bar i{display:block;height:100%;background:var(--own)}
.goal.done{opacity:.5}
input#q{width:100%;box-sizing:border-box;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink);margin-top:6px}
.row.link{cursor:pointer}
.needs{display:grid;grid-template-columns:repeat(3,22px);gap:3px 4px;align-items:center;background:none;border:0;padding:0;cursor:pointer;color:var(--muted)}
.needs span{display:block;height:6px;background:var(--line);border-radius:3px;overflow:hidden}.needs i{display:block;height:100%}
.needs small{grid-column:1/-1;font-size:9px;text-transform:uppercase;letter-spacing:.06em}
.tabs{display:flex;gap:4px;margin:8px 0 4px;overflow-x:auto;scrollbar-width:none;position:sticky;top:20px;z-index:2;background:var(--panel);padding-block:6px;box-shadow:0 6px 8px -8px rgba(0,0,0,.18)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;font:inherit;font-size:13px;font-weight:600;padding:8px 10px;border:0;background:var(--line);color:var(--muted);border-radius:999px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.row label{white-space:nowrap}
#nav{display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));position:relative;z-index:6}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 7px;background:none;border:0;color:var(--muted);font:600 11px var(--body);cursor:pointer}
#nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#nav button[aria-current="true"]{color:var(--accent)}
.grab{position:sticky;top:0;z-index:3;display:flex;justify-content:center;align-items:center;height:20px;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 0;background:var(--panel);cursor:grab;touch-action:none;border:0;width:calc(100% + 2*max(16px,env(safe-area-inset-left,0px)));padding:0}
.grab::before{content:"";width:40px;height:5px;border-radius:3px;background:var(--line)}
#street{position:absolute;inset:0;z-index:1;background:var(--sea)}
#sheet{z-index:4}
.chip{font:600 12px var(--body);background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.15)}
#stbar{position:absolute;z-index:3;top:10px;left:max(12px,env(safe-area-inset-left,0px));display:flex;gap:6px}
#tostreet{position:absolute;z-index:3;right:max(12px,env(safe-area-inset-right,0px));top:10px;background:var(--ink);color:var(--panel);border-color:var(--ink)}
#placebar{position:absolute;z-index:3;left:12px;right:12px;bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;box-shadow:0 4px 16px rgba(0,0,0,.2);font-size:13px}
#placebar span{color:var(--muted)}
.mpin.sale span{background:#16a34a;border-style:dashed}.mpin.sale.deal span{background:#ca8a04}
#placebar.offer{z-index:4;flex-wrap:wrap}#placebar.offer>div{flex:1 1 100%}#placebar.offer>span{flex:1 1 100%;justify-content:flex-end}#placebar .tag{color:#fff}
#placebar .ofd{font-size:12px;color:var(--muted);margin-top:2px}#placebar .ofd b{color:var(--ink)}
.mpin{background:none;border:0}
.mpin span{display:inline-block;transform:translate(-50%,-100%);margin-left:18px;margin-top:30px;color:#fff;font:700 10.5px var(--mono);padding:4px 7px;border-radius:7px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);white-space:nowrap;position:relative}
.mpin span::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-5px;border:5px solid transparent;border-top-color:#fff}
.leaflet-container{font-family:var(--body);background:#0d1418}
/* dark street map: OSM tiles inverted into a night palette (pins stay in their own colors) */
#street .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.55)}
#street .leaflet-control-attribution{background:rgba(13,20,24,.75);color:#9aa7b1}#street .leaflet-control-attribution a{color:#7dd3c0}
#street .leaflet-bar a{background:#1b2429;color:#e5ebef;border-color:#2c373d}
#amb{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
#street[hidden]~#amb{display:none}
#wx{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
#phone{position:fixed;z-index:20;left:0;top:0;box-sizing:border-box;width:300px;height:580px;zoom:var(--phs,1);background:#111418;border-radius:32px;padding:8px;box-shadow:0 18px 40px rgba(0,0,0,.35),0 0 0 1.5px #2b3138 inset;display:flex;flex-direction:column;color:#eef1f4;touch-action:none;transition:border-radius .2s}
#phone.dragging{transition:none;opacity:.92}
#phone.folded{box-sizing:content-box;width:auto!important;height:auto!important;padding:0;border-radius:999px;background:none;box-shadow:none}
.ph-tab{display:flex;align-items:center;gap:6px;background:#111418;color:#eef1f4;border:0;border-radius:999px;padding:8px 12px 8px 8px;font:600 12px var(--mono);box-shadow:0 6px 18px rgba(0,0,0,.3);cursor:grab;touch-action:none}

.ph-top .ph-grip{width:30px;height:4px;background:#3a424c}

.ph-top .ph-gear{margin-left:auto;font-size:11px;font-weight:700;width:auto;padding:0 8px;border-radius:12px}.ph-top .ph-gear+button{margin-left:0}
.ph-top button{margin-left:auto;background:#262c33;color:#eef1f4;border:0;width:24px;height:24px;border-radius:50%;font-size:16px;line-height:1;cursor:pointer}

.ph-screen::-webkit-scrollbar{display:none}
.ph-time{font:800 40px var(--display);text-align:center;letter-spacing:-.03em;line-height:1}
.ph-date{text-align:center;font-size:11px;color:#b8c2cc;margin:4px 0 16px}
.ph-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));justify-items:center;gap:14px 4px;width:100%}
.ph-grid button{background:none;border:0;color:#eef1f4;display:flex;flex-direction:column;align-items:center;gap:5px;font:500 10.5px var(--body);cursor:pointer;width:100%;min-width:0;padding:0;box-sizing:border-box}.ph-grid button span{display:block;max-width:100%;text-align:center;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.ph-apphead{display:flex;align-items:center;gap:8px;margin:-4px 0 10px;font-size:15px}
.ph-apphead button{background:#ffffff1a;color:#fff;border:0;width:28px;height:28px;border-radius:50%;font-size:18px;cursor:pointer}
.ph-big{font:700 28px var(--mono);letter-spacing:-.02em}
.ph-sub{font-size:11px;color:#b8c2cc;margin:2px 0 10px}
.ph-rows{display:grid;gap:7px;font-size:12px}
.ph-rows>div:not(.bar){display:flex;justify-content:space-between}.ph-rows span{color:#b8c2cc}.ph-rows b{font-family:var(--mono)}
.ph-list{display:flex;flex-direction:column;gap:6px;font-size:11.5px}

.ph-list small{display:block;color:#93a0ad;font-size:10px;margin-bottom:2px}
.ph-list button small{display:inline;margin-left:6px}

.ph-item small{display:block;font-weight:400;color:#93a0ad;font-size:10px}.ph-item b{font-family:var(--mono)}.ph-item:disabled{opacity:.4}
.ph-card{background:#ffffff12;border-radius:12px;padding:10px;margin-bottom:8px;font-size:12px;display:flex;flex-direction:column;gap:2px}.ph-card span{color:#b8c2cc;font-size:11px}
.ph-card.storm{background:linear-gradient(135deg,#334155,#1e293b);border:1px solid #475569}

.ph-homebar{display:block;margin:7px auto 1px;width:84px;height:5px;border-radius:3px;background:#5b6470;border:0;cursor:pointer;padding:0}

/* ---------- player market: list goods, NPCs buy minute by minute when local stock runs low ---------- */
S.lst=S.lst||[];S.mkt=S.mkt||{};if(!S.mlast)S.mlast=Date.now();
const MIN=60000,LOW=.6,FEE=.02;
const mkey=(c,g)=>c.id+":"+g;
const mT=(c,g)=>Math.max(20,depth(c,g)/3);                                   // units that make a "full" local market
const mCons=(c,g)=>(.004+.002*c.size)*({raw:.7,mid:.8,fin:1.2}[G[g][2]]||1); // share of stock used up per minute
const mRefill=(c,g)=>.008+(((c.id*131+GK.indexOf(g)*17)%97)/97)*.02;         // NPC suppliers restock rate
const mRef=(c,g)=>G[g][1]*cityF(c,g);
function mLevel(c,g,now){const k=mkey(c,g),m=S.mkt[k]||(S.mkt[k]={L:.7,t:now||Date.now()});now=now||Date.now();
  const mins=Math.max(0,(now-m.t)/MIN),kk=mRefill(c,g),eq=1-mCons(c,g)/kk;m.L=Math.min(1,Math.max(0,eq+(m.L-eq)*Math.exp(-kk*mins)));m.t=now;return m.L}
const maxPay=(c,g,stockLv)=>mRef(c,g)*(1+Math.max(0,LOW-stockLv)*1.5);                   // the emptier the shelves, the more buyers pay
const mState=stockLv=>stockLv<.3?["Very low","bust"]:stockLv<LOW?["Low","bust"]:stockLv<.85?["Normal",""]:["Saturated","boom"];
/* dumping on the spot market fills local shelves too */
function mFill(c,g,q){if(G[g][2]==="gov")return;const stockLv=mLevel(c,g);S.mkt[mkey(c,g)].L=Math.min(1,stockLv+q/mT(c,g))}
function runMarket(now){if(!S.lst.length){S.mlast=now;return}
  let mins=Math.min(2880,Math.floor((now-S.mlast)/MIN));if(mins<1)return;const sold={};
  for(let i=1;i<=mins;i++){const t=S.mlast+i*MIN;const keys=[...new Set(S.lst.map(l=>l.city+":"+l.g))];
    for(const key of keys){const [cid,g]=key.split(":"),c=CITIES[+cid];const stockLv=mLevel(c,g,t);if(stockLv>=LOW)continue;
      let want=(.8-stockLv)*mT(c,g)*.25;const cap=maxPay(c,g,stockLv);                    // buyers trickle in: a quarter of the gap each minute
      const offers=S.lst.filter(l=>l.city==cid&&l.g===g&&l.q>0&&l.p<=cap).sort((a,b)=>a.p-b.p);
      for(const l of offers){if(want<=0)break;const n=Math.min(l.q,want);l.q-=n;l.sold=(l.sold||0)+n;want-=n;const v=n*l.p*(1-FEE);S.cash+=v;S.earned=(S.earned||0)+v;
        S.mkt[key].L=Math.min(1,S.mkt[key].L+n/mT(c,g));const sk=c.name+"|"+g;sold[sk]=sold[sk]||[0,0];sold[sk][0]+=n;sold[sk][1]+=v}}}
  S.mlast+=mins*MIN;
  for(const l of S.lst)if(l.q<1e-6&&!l.doneAt){l.doneAt=now;S.log.unshift(`Listing sold out: ${Math.round(l.sold)} ${G[l.g][0].toLowerCase()} in ${CITIES[l.city].name}`);S.log=S.log.slice(0,3)}
  S.lst=S.lst.filter(l=>!(l.doneAt&&now-l.doneAt>DAYMS));
  const ks=Object.keys(sold);if(ks.length&&mins<5){const [cn,g]=ks[0].split("|");toast(`NPCs bought ${gq(sold[ks[0]][0])} ${G[g][0].toLowerCase()} in ${cn} · +${fmt(sold[ks[0]][1])}`)}
  else if(ks.length){const tot=ks.reduce((a,k)=>a+sold[k][1],0);S.log.unshift(`Market sales while away: ${fmt(tot)}`);S.log=S.log.slice(0,3)}}

/* ---------- personal needs: health, food, mind ---------- */
S.need=S.need||{h:100,f:100,m:100};if(!Array.isArray(S.lux))S.lux=[];

const DECAY={h:1.2,f:6,m:4};
function runNeeds(hours){const N=S.need;let left=hours;
  while(left>1e-6){const h=Math.min(.25,left);left-=h;

      if(hm&&N[k]<HOMECAP)N[k]=Math.min(HOMECAP,N[k]+15*h);   // home refills toward 85
      else N[k]=Math.max(hm?HOMECAP:0,N[k]+d*h*(S.home&&!hm?.5:1))}                // above 85 (or homeless) it decays
    if(N.h<=0)hospital()}}

  h+=`<p class="d" style="font-size:12px;color:var(--muted);margin:2px 0 0">${S.home?`Your home keeps each need at ${HOMECAP}% or better. Buy things to top up the rest.`:"No home: every need drains over time. Renting even a room keeps them at "+HOMECAP+"%."}

    if(!S.iev[id]){const ks=Object.keys(IEV),t=ks[Math.floor(Math.random()*ks.length)];S.iev[id]={t,d:2+Math.floor(Math.random()*5)};

  for(const id in S.events){if(--S.events[id].d<=0)delete S.events[id]}
  if(Math.random()<.35){const c=CITIES[Math.floor(Math.random()*CITIES.length)];if(!S.events[c.id]){
    const boom=Math.random()<.55;S.events[c.id]={m:boom?1.6:.55,d:3+Math.floor(Math.random()*4)};

  return inc}

const trHere=id=>trAt()[id]||0;
const repOf=i=>LG().rep[i]||0;

function trReserved(skip){let r=0;for(const c of hubs())if(c.id!==skip)r+=HB(c.id).res;return Math.min(r,LG().trucks)}

function cbEcon(t,sz,st){const m=(CB_SIZE[sz]||CB_SIZE.m).m,y=CB_STY[st]||CB_STY.std,sp=SUP[t.k],sc=sp?sp.r*sp.c:0,

  const R=OFC_ROOM,D=OFC.camD;let cx=P.x+Math.sin(P.yaw)*D,cz=P.z+Math.cos(P.yaw)*D;cx=Math.max(-R.w/2+.25,Math.min(R.w/2-.25,cx));cz=Math.max(-R.d/2+.25,Math.min(R.d/2-.25,cz));
  OFC.cam.position.set(cx,OFC.camH,cz);OFC.cam.lookAt(P.x-Math.sin(P.yaw)*1.2,.9,P.z-Math.cos(P.yaw)*1.2);

function ofNearStep(){const P=OFC.p,d=ofData(OFC.key);let best=null,bd=1.25;const fx=-Math.sin(P.yaw),fz=-Math.cos(P.yaw);
  const test=(o,f,bias)=>{const cx=Math.max(f.x0,Math.min(P.x,f.x1)),cz=Math.max(f.z0,Math.min(P.z,f.z1));let dd=Math.hypot(P.x-cx,P.z-cz)-(bias||0);const vx=o.x-P.x,vz=o.z-P.z,vl=Math.hypot(vx,vz)||1;dd+=(1-(vx*fx+vz*fz)/vl)*.25;if(dd<bd){bd=dd;best=o}};
  for(const o of d.items)if(!OFFICE_ITEMS[o.type].walk)test(o,ofFoot(o),OFFICE_ITEMS[o.type].small&&ofSurf(o,d.items)?.2:0); // items on a desk win over the desk
  test({type:"_kiosk",x:OFC_KIOSK.x,z:OFC_KIOSK.z},{x0:OFC_KIOSK.x-.5,x1:OFC_KIOSK.x+.5,z0:OFC_KIOSK.z-.5,z1:OFC_KIOSK.z+.5});

/* ---------- lasting strike damage: S.dmg[cityId] = {l0: damage 0..1 at the strike, t: strike time, own: 1 if only the player's own strikes did it, k: heaviest weapon}

const DMG={core:[0,10,25,60,120,250], // dense economic core in km² by market size 1..5 (rounded; a megacity's built-up area is ~1,000–2,000 km², most value sits in the centre)
  k:1.5,          // hit share = 1 − e^(−k·A/core): a 50 km² nuke covers a size-1 core (99%) but ≈26% of a size-5 core
  rep:[7,113],    // repair days = 7 + 113 × damage: a light hit ≈1–2 weeks, a destroyed city ≈4 months (after any uninhabitable period)

const dmgWord=l=>l>=DMG.dead?"destroyed":l>=.4?"devastated":l>=.1?"heavily damaged":l>=.02?"damaged":"lightly damaged";
function dmgLeft(c){const e=(S.dmg||{})[c.id],l=dmgLvl(c);if(!e||!l)return 0;const st=Math.max(+e.t||0,+(S.unh||{})[c.id]||0);return Math.max(0,st+dmgRepDays(e.l0)*DAYMS-Date.now())}

/* ---------- Logistics hub: the "Logistics" page of the HQ dashboard ----------
   MODEL (all state in S.lx, created lazily by LX(); every field has a default, so old saves load):
   - Nothing parallel is invented. Goods still live in S.inv (city warehouses; mines/factories/farms drop output there and factories/shops/plots
     draw inputs from the warehouse of their own city). So "send ore to the steel mill" = move ore into that city's warehouse.
   - OWN FLEET: a shipment of q units reserves (escrows) q out of the source warehouse at once, as job {id,g,q,left,got,ret,from,to,kind,vs,cost,val,p0,ord}.
     Vehicles listed in job.vs (v.job = job id) pull loads of <= capU(type,good) units (VEH payload tonnes / TPU weight) out of job.left via the existing depart(v,c,d,"",t,{g,q,job}), so fuel, speed, tech and
     trucking/port bonuses, HQ-link discount and the on-map animation are the normal ones. After delivery (runFleet -> lxDeliver/lxVeh) an idle vehicle drives back
     empty (fuel paid) for the next load until left = 0; trips = ceil(q / capacity), split over every vehicle on the job. Chains run on the arrival timestamps, so offline catch-up is exact.
   - HIRED: rival carriers (carrierQuote, fee goes to that rival) take the whole quantity in one go: S.lx.sh = [{id,k:"g"|"s",g|bk,q,from,to,kind,ri,price,dep,arr,lost,ord}].
     A lost shipment refunds the fee AND returns the goods to the source (goods are never destroyed here). k:"s" moves business stock units (S.stock) between two
     branches of the same business; they weigh lxc().stkW of a cargo unit when the carrier is priced.
   - kind: "wh" = into a warehouse (consumers there pick it up), "mkt" = sold on arrival at that city's market (needs an HQ there; gov goods need govOK; otherwise held in a warehouse),
     "new" = same as wh but opens a warehouse first (whCost). Warehouse room (incl. what is already inbound) is checked before sending.
   - SAFETY: lxBlock() = uninhabitable end (existing unh pause), sanctions/war between the two countries (S.wars l>=2), or a destination country at war (warLvl>=4, like travel).
     Goods leave stock only when the shipment is created and always end up delivered, sold, or back at the source: cancel/failed/orphaned jobs return the escrow to the source warehouse; a
     vehicle that cannot unload (uninhabitable city) holds cargo and unloads later (runFleet). No negative stock: every amount is clamped to what is there.
   - STANDING ORDERS S.lx.ord=[{id,nm,on,g (good or "*mine"/"*farm"/"*fact"),sc:{t:all|reg|city,v},keep,min,tgt,bat,to:{k:wh|mkt,city},car:auto|own|hire,n,q,cost,val,last,why}]
     run once per game day in simDay (lxDay): at most perDay shipments in total and perOrd per order, fair rotation, nothing new when 60+ shipments are in flight. A warehouse destination
     with min>0 only refills when stock+inbound < min, up to tgt (0 = send every surplus); sources keep `keep` units, nearest source first. 'Run now' does the same on demand.
   - HISTORY S.lx.hist (last 60 shipments) and per-route totals S.lx.rt (<=40 routes): cost (fuel/fees) vs value moved (sale proceeds or destination market value) vs the same units at origin prices.
   - COST: per accrue lxTick scans S.lx.sh and the fleet once; per game day <= perDay shipments are planned. The page re-renders only while the window is open. */
function lxg(n){n=+n||0;const a=Math.abs(n);return a>=1e4?(n/1e3).toFixed(1)+"K":a>=100||Math.abs(n-Math.round(n))<.05?Math.round(n).toLocaleString():n.toFixed(1)}
function lxc(){return lxc.v||(lxc.v={maxJobs:40,maxSh:60,maxOrd:24,perDay:6,perOrd:3,hist:60,rt:40,stkW:.05,
  reg:{am:"Americas",eu:"Europe",af:"Africa",as:"Asia",oc:"Oceania"},grp:{"*mine":["All mined resources","Mine"],"*farm":["All farm products","Farm"],"*fact":["All factory products","Factory"]}})}
function LX(){const x=S.lx=S.lx&&typeof S.lx==="object"?S.lx:{};if(!Array.isArray(x.jobs))x.jobs=[];if(!Array.isArray(x.sh))x.sh=[];if(!Array.isArray(x.ord))x.ord=[];if(!Array.isArray(x.hist))x.hist=[];

function lxN(g){return G[g]?G[g][0]:String(g)}
function lxLog(m){S.log.unshift(m);S.log=S.log.slice(0,3)}
function lxAssets(){const X=S.lx;let a=0;if(!X)return 0;for(const j of X.jobs||[])if(G[j.g])a+=j.left*G[j.g][1]*.9;for(const s of X.sh||[])if(s.k==="g"&&G[s.g])a+=s.q*G[s.g][1]*.9;return a}
function lxGoodsOf(sel){if(!sel||sel[0]!=="*")return G[sel]?[sel]:[];const cat=lxc().grp[sel];if(!cat)return[];const set=new Set();
  for(const o of OPS)if(o.cat===cat[1]||(sel==="*farm"&&o.cat==="Ranch"))for(const g in o.out)if(g!=="power"&&G[g])set.add(g);return [...set]}
function lxCanSell(d,g){return !!(d&&hasHQ(d)&&(G[g][2]!=="gov"||govOK(d)))}
function lxSellEst(d,g,q){if(G[g][2]==="gov")return G[g][1]*q;const m0=((S.px[d.id]||{})[g])||1,m1=Math.max(.4,m0*Math.exp(-q/depth(d,g)));return G[g][1]*cityF(d,g)*(m0+m1)/2*q*(typeof siteLaw==="function"?siteLaw(d):1)}

function lxSpace(d){return hasWh(d)?Math.max(0,whCap(d)-stored(d)-lxIncoming(d,"",1)):0}   // free TONNES incl. inbound
const lxSpaceU=(d,g)=>lxSpace(d)/tpu(g);                                                  // free room in units of good g
/* ----- shipping plans (pure: no state is changed) ----- */
function lxLegs(vs,c,d,q,g){const km=distKm(c,d),w=g?tpu(g):1,st=vs.map(v=>({t:0,n:0,cap:capU(v.type,g||""),leg:legMs(v,c,d),ret:vFuel(v.type,km,0,c,d),ty:v.type}));

/* item {t:"g",g} (warehouse goods) or {t:"s",bk} (business stock units); kind wh|mkt|new; spec own:all | own:<id> | hire:<i> */
function lxPlan(item,c,d,q,kind,spec){const P={ok:false,why:"",mode:"",km:distKm(c,d),q,cap:0,trips:1,first:0,last:0,total:0,f1:0,extra:0,vs:[],i:-1,rel:1,lab:""};

/* pick the cheapest workable carrier for standing orders; mode auto|own|hire */
function lxAuto(item,c,d,q,mode,kind){let best=null,why="";

.lx-it{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--dxline);flex-wrap:wrap}
.lx-it:last-child{border:0}
.lx-it .m{flex:1;min-width:150px}
.lx-it .m b{font:700 13.5px Figtree,sans-serif;color:var(--dxink)}
.lx-it .m>span{display:block;font:500 12.5px Figtree,sans-serif;color:var(--dxink3);margin-top:1px}
.lx-it .m>small{display:block;font:500 11.5px Figtree,sans-serif;color:var(--dxmut2);margin-top:2px;overflow-wrap:anywhere}
.lx-it .a{display:flex;gap:6px;flex-wrap:wrap}
.lx-btn{border:1px solid var(--dxline);background:var(--dxcard);color:var(--dxink2);border-radius:10px;font:600 12.5px Figtree,sans-serif;padding:8px 12px;min-height:36px;cursor:pointer}
.lx-btn:hover:not(:disabled){background:var(--dxhov)}
.lx-btn:disabled{opacity:.45;cursor:default}
.lx-btn.pri{background:var(--dxink);color:var(--dxcard);border-color:var(--dxink)}
.lx-btn.pri:hover:not(:disabled){background:var(--dxink2)}
.lx-btn.red{color:#b91c1c;border-color:#fecaca}
.lx-f{display:grid;gap:10px}
.lx-f label{display:grid;gap:4px;font:600 12px Figtree,sans-serif;color:var(--dxmut);min-width:0}
.lx-in{width:100%;border:1px solid var(--dxline);background:var(--dxcard);border-radius:10px;font:500 14px Figtree,sans-serif;color:var(--dxink);padding:9px 10px;min-height:40px;min-width:0}
.lx-pre{display:flex;gap:6px;flex-wrap:wrap}
.lx-row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.lx-pv{background:var(--dxsoft);border:1px solid var(--dxline);border-radius:12px;padding:10px 12px}
.lx-pv div{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font:500 12.5px Figtree,sans-serif;color:var(--dxink3);border-bottom:1px dashed var(--dxline)}
.lx-pv div:last-child{border:0}
.lx-pv b{font-weight:700;color:var(--dxink);text-align:right;overflow-wrap:anywhere}
.lx-pv .w{display:block;color:#b91c1c;font-weight:600}
.lx-tag{display:inline-block;font:700 10.5px Figtree,sans-serif;padding:2px 7px;border-radius:999px;background:var(--dxsoft);color:var(--dxink3);margin-left:6px;vertical-align:1px}
.lx-tag.g{background:#dcfce7;color:#15803d}.lx-tag.r{background:#fee2e2;color:#b91c1c}.lx-tag.b{background:#e0ecff;color:#1d4ed8}.lx-tag.y{background:#fef3c7;color:#b45309}
.lx-bar{height:6px;background:var(--dxsoft);border-radius:3px;overflow:hidden;margin-top:5px}
.lx-bar i{display:block;height:100%;background:#2563eb}
.lx-note{font:600 12.5px Figtree,sans-serif;color:#15803d}
.lx-sub{font:600 12px Figtree,sans-serif;color:var(--dxmut);margin:0 0 6px}
@container (max-width:620px){.lx-k{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.lx-row2{grid-template-columns:minmax(0,1fr)}}

  S.cash-=opt.price;const dur=(local?opt.sec*1000:opt.min*60000);
  const toPt=local?dest:(opt.m==="plane"?airportPos(dest):opt.m==="car"?dest:stationPos(dest));
  if(typeof bunkExit==="function")bunkExit(1);S.trip={mode:opt.m,n:opt.n,from:{...S.loc},to:{city:dest.city!=null?dest.city:dest.id,lat:toPt.lat,lon:toPt.lon,label:dest.label||dest.name},dep:Date.now(),arr:Date.now()+dur,local:!!local};
  S.log.unshift(local?`${opt.n} to ${S.trip.to.label}`:`${opt.n} to ${dest.name} · ${fmtDur(dur).replace(" min","m")} · ${fmt(opt.price)}`);S.log=S.log.slice(0,3);save();hud();draw();return true}
function runTrip(now){const t=S.trip;if(!t||now<t.arr)return;S.loc={city:t.to.city,lat:t.to.lat,lon:t.to.lon};S.trip=null;onLocPub();
  S.log.unshift(t.local?`Arrived at ${t.to.label}`:`Landed in ${CITIES[t.to.city].name}`.replace("Landed",t.mode==="plane"?"Landed":"Arrived"));S.log=S.log.slice(0,3);
  if(!t.local)toast(`Welcome to ${CITIES[t.to.city].name}`);save();hud();draw();if(typeof inStreet!=="undefined"&&inStreet)renderPins()}
function tripPos(now){const t=S.trip;if(!t)return null;const u=Math.min(1,(now-t.dep)/(t.arr-t.dep));const g=d3.geoInterpolate([t.from.lon,t.from.lat],[t.to.lon,t.to.lat])(u);return{lon:g[0],lat:g[1],u}}
/* you have to be there in person to buy or rent somewhere */
let tvDest=null,tvTab="go",tvQ="";
window.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest(typeof PLACE_SEL!=="undefined"?PLACE_SEL:"[data-buy]");if(!b||!sel||b.disabled||!sheet.contains(b))return;
  if(typeof bypass!=="undefined"&&bypass)return;
  const c=sel;if(!traveling()&&S.loc.city===c.id)return;
  e.stopImmediatePropagation();e.preventDefault();
  toast(traveling()?"You're still travelling. Wait until you arrive.":`You're in ${here().name}. Travel to ${c.name} to buy there.`);
  if(!traveling()){tvDest=c.id;tvTab="go";PH.open=true;PH.app="travel";phSave();phRender()}},true);
/* ---------- phone travel app ---------- */
function tvFind(q){q=q.trim().toLowerCase();return CITIES.filter(c=>c.id!==S.loc.city&&(c.name.toLowerCase().includes(q)||String(c.country).toLowerCase().includes(q)))}
function tvResHtml(){if(!tvQ.trim())return"";const r=tvFind(tvQ);return r.length?r.map(c=>`<button class="ph-item" data-ph="tvpick" data-c="${c.id}" aria-pressed="${tvDest===c.id}" style="${tvDest===c.id?"outline:1.5px solid #6ee7c8":""}"><span>${c.name}<small>${c.country}${!hasAirport(c)?" · no airport":""}</small></span></button>`).join(""):`<p class="ph-sub" id="tvnone">No country or city matches "${tvQ.trim().replace(/[<>&"]/g,"")}".</p>`}
function travelApp(){const now=Date.now(),t=S.trip;let h="";
  if(t){const u=Math.min(1,(now-t.dep)/(t.arr-t.dep));return `<div class="ph-card storm"><b>${t.n} → ${t.to.label||CITIES[t.to.city].name}</b><span>Arrives in ${fmtDur(t.arr-now)}</span>
    <div class="bar" style="height:6px;grid-column:auto;margin-top:6px"><i style="width:${u*100}%;background:#6ee7c8"></i></div></div><p class="ph-sub">You can't buy or work while travelling. Your businesses keep running.</p>`}
  h+=`<div class="ph-sub" style="margin-top:-4px">You are in <b style="color:#fff">${here().name}</b>${S.job&&S.job.city!==S.loc.city?" · away from work":""}</div>
    <div class="ph-seg">${[["go","Cities"],["ride","Ride"],["garage","Garage"]].map(([k,n])=>`<button data-ph="tvtab" data-k="${k}" aria-pressed="${tvTab===k}">${n}</button>`).join("")}</div>`;
  if(tvTab==="go"){const dests=CITIES.filter(c=>c.id!==S.loc.city);
    h+=`<div style="position:relative;margin-bottom:8px"><input class="ph-calc" id="tvq" type="search" autocomplete="off" placeholder="Search country or city…" aria-label="Search countries and cities" value="${tvQ.replace(/"/g,"&quot;")}" style="font-size:13px;margin:0;padding-right:34px"><button data-ph="tvclr" aria-label="Clear search" id="tvclr" style="${tvQ?"":"display:none;"}position:absolute;right:6px;top:50%;transform:translateY(-50%);background:#ffffff22;color:#fff;border:0;width:22px;height:22px;border-radius:50%;cursor:pointer;line-height:1">×</button></div><div id="tvres">${tvResHtml()}</div>`;
    if(!tvQ.trim())h+=`<select class="ph-calc" id="tvsel" style="font-size:13px"><option value="">Choose a destination…</option>${dests.map(c=>`<option value="${c.id}" ${tvDest===c.id?"selected":""}>${c.name}${!hasAirport(c)?" (no airport)":""}</option>`).join("")}</select>`;
    if(tvDest!=null&&tvDest!==S.loc.city){const d=CITIES[tvDest],{km,o}=cityOptions(here(),d);
      h+=`<p class="ph-sub">${Math.round(km).toLocaleString()} km${!hasAirport(here())?` · ${here().name} has no airport`:""}${!hasAirport(d)?` · ${d.name} has no airport`:""}</p>`;
      h+=o.length?o.map((x,i)=>`<button class="ph-item" data-ph="book" data-i="${i}" ${S.cash<x.price?"disabled":""}><span>${x.n}<small>${x.note} · ${fmtDur(x.min*60000)}</small></span><b>${fmt(x.price)}</b></button>`).join(""):`<p class="ph-sub">No direct route. Get to a city with an airport first.</p>`}}
  else if(tvTab==="ride"){const c=here(),spots=[{label:"Airport",...airportPos(c),hide:!hasAirport(c)},{label:"Central station",...stationPos(c)},{label:"City centre",lat:c.lat,lon:c.lon}];
    for(const e of entities())if(e.c.id===c.id&&S.pos[e.key])spots.push({label:e.label,lat:S.pos[e.key].lat,lon:S.pos[e.key].lon});
    h+=`<p class="ph-sub">Getting around ${c.name}</p>`+spots.filter(x=>!x.hide).map((x,i)=>{const {km,o}=rideOptions(S.loc,x);return `<div class="ph-card"><b>${x.label}</b><span>${km.toFixed(1)} km away</span><div class="ph-rides">${o.map((r,j)=>`<button data-ph="ride" data-i="${i}" data-j="${j}" ${S.cash<r.price?"disabled":""}>${r.n}<small>${r.price?fmt(r.price):"free"} · ${Math.max(1,Math.round(r.sec))}s</small></button>`).join("")}</div></div>`}).join("");
    PH.spots=spots.filter(x=>!x.hide)}
  else h+=garageHtml();
  return h}
function garageHtml(){let h="";{h+=S.car?`<div class="ph-card"><b>Your ${CK[S.car.k].n}</b><span>Fuel ${fmt(CK[S.car.k].fuel)}/km · ${Math.round((CK[S.car.k].f-1)*100)}% faster</span></div><button class="ph-item" data-ph="sellcar"><span>Sell car<small>Get back 60%</small></span><b>${fmt(CK[S.car.k].p*.6)}</b></button>`:"";
    h+=CARS.filter(c=>!S.car||c.k!==S.car.k).map(c=>`<button class="ph-item" data-ph="buycar" data-k="${c.k}" ${S.cash<c.p?"disabled":""}><span>${c.n}<small>${c.f>1?Math.round((c.f-1)*100)+"% faster · ":""}${fmt(c.fuel)}/km fuel</small></span><b>${fmt(c.p)}</b></button>`).join("")+`<p class="ph-sub">A car replaces taxis in town and lets you drive between cities on the same continent.</p>`}
  return h}
PH.el.addEventListener("input",e=>{if(e.target.id!=="tvq")return;tvQ=e.target.value;PH.touched=Date.now();const r=PH.el.querySelector("#tvres"),c=PH.el.querySelector("#tvclr");if(r)r.innerHTML=tvResHtml();if(c)c.style.display=tvQ?"":"none";if(!tvQ.trim()){phRender();const i=PH.el.querySelector("#tvq");if(i)i.focus()}});
PH.el.addEventListener("change",e=>{if(e.target.id==="tvsel"){tvDest=e.target.value===""?null:+e.target.value;phRender()}});
PH.el.addEventListener("click",e=>{const b=e.target.closest("[data-ph]");if(!b||PH.dragged)return;const a=b.dataset.ph;
  if(a==="tvtab"){tvTab=b.dataset.k;phRender()}
  else if(a==="tvpick"){tvDest=+b.dataset.c;phRender()}
  else if(a==="tvclr"){tvQ="";phRender();const i=PH.el.querySelector("#tvq");if(i)i.focus()}
  else if(a==="book"){const d=CITIES[tvDest],{o}=cityOptions(here(),d);if(startTrip(d,o[+b.dataset.i],false)){tvDest=null;phRender()}}
  else if(a==="ride"){const x=PH.spots[+b.dataset.i],{o}=rideOptions(S.loc,x);startTrip({...x,city:S.loc.city},o[+b.dataset.j],true);phRender()}
  else if(a==="buycar"){const c=CK[b.dataset.k];if(S.cash<c.p)return;if(S.car)S.cash+=CK[S.car.k].p*.6;S.cash-=c.p;S.car={k:c.k};toast(`You bought a ${c.n.toLowerCase()}`);save();hud();phRender()}
  else if(a==="sellcar"){S.cash+=CK[S.car.k].p*.6;S.car=null;toast("Car sold");save();hud();phRender()}},true);

const atHomeNow=()=>!!(S.home&&!S.trip&&S.loc.city===S.home.city);

/* ---------- misc ---------- */
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.remove("good","bad");t.classList.toggle("top",!!(typeof PH!=="undefined"&&PH&&PH.open));
  if(/^(Opened|Approved|You got the job|You earned|Bill passed|Bail posted|Law changed|Contract awarded|Talks worked|Arms sold|Bought|Card approved|Day \d+ streak|.*paid off)/.test(m)){t.classList.add("good");if(typeof confetti==="function"&&!/^Day/.test(m))confetti(28,innerWidth/2,innerHeight-80);if(typeof vib==="function")vib(20)}
  else if(/^(Denied|Scandal|Caught|Arrested|Application turned down|Bill failed|Talks collapsed|Need |You need|Not from prison)/.test(m)){t.classList.add("bad");if(typeof vib==="function")vib([15,30,15])}
  t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),1800)}
window.addEventListener("resize",resize);
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",draw);
new MutationObserver(draw).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
/* offline: full pay for the time away, up to 48 hours, then a welcome-back summary */
function catchUp(){const now0=Date.now(),away=now0-(S.acc||now0),cash0=S.cash,debt0=S.debt||0,hadStock=Object.keys(S.stock||{}).filter(k=>S.stock[k]>0);
  const got=accrue();const offPeace=S._offPeace||[];delete S._offPeace;if(offPeace.length)setTimeout(()=>toast(`War weariness forced white peace with ${offPeace.join(", ")} while you were away`),600);
  S.last=Date.now();checkGoals();save();hud();draw();
  if(away>5*60000){const hrs=away/DAYMS,t=hrs>=1?hrs.toFixed(1)+" h":Math.round(away/60000)+" min";
    if(got>1){S.log.unshift(`While you were away (${t}): ${fmt(got)} earned`);S.log=S.log.slice(0,3);hud()}
    const ran=hadStock.filter(k=>!(S.stock[k]>0));awaySummary({away,got,net:S.cash-cash0,debt:(S.debt||0)-debt0,ran,capped:away>48*DAYMS,peace:offPeace})}}
function awaySummary(r){let el=$("#away");if(!el){el=document.createElement("div");el.id="away";document.body.appendChild(el)}
  const nm=k=>{const [id,b]=k.split(":");const c=CITIES[id],bz=BIZ.find(x=>x.k===b);return (bz?bz.n:b)+(c?" in "+c.name:"")};
  const row=(a,b,col)=>`<div style="display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)"><span>${a}</span><b${col?` style="color:${col}"`:""}>${b}</b></div>`;
  el.innerHTML=`<div style="position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px" data-away="x"><div style="background:var(--panel);color:var(--ink);border-radius:14px;max-width:360px;width:100%;padding:18px;box-shadow:0 18px 40px rgba(0,0,0,.35)">
    <h3 style="margin:0 0 4px">While you were away</h3><p class="d" style="margin:0 0 10px;color:var(--muted)">Your empire kept running for ${fmtDur(r.away)}.</p>
    ${r.got>1?row("Earned",fmt(r.got),"var(--good)"):""}${row("Cash change",(r.net>=0?"+":"")+fmt(r.net),r.net>=0?"var(--good)":"var(--bad)")}${Math.abs(r.debt)>1?row("Debt change",(r.debt>0?"+":"")+fmt(r.debt),r.debt>0?"var(--bad)":"var(--good)"):""}
    ${r.ran.length?`<p style="margin:10px 0 4px;color:var(--bad)"><b>Ran out of stock:</b></p><div class="d">${r.ran.slice(0,5).map(nm).join("<br>")}${r.ran.length>5?`<br>and ${r.ran.length-5} more`:""}</div>`:""}
    ${(r.peace||[]).length?`<p class="d" style="margin:10px 0 0"><b>White peace</b> (war weariness hit 100) with ${r.peace.join(", ")}.</p>`:""}
    ${r.capped?`<p class="d" style="margin:10px 0 0;color:var(--muted)">Offline earnings stop after 48 hours. Check in at least every two days to keep everything paid.</p>`:""}
    <button class="buy" data-away="x" style="margin-top:14px;width:100%">Back to work</button></div></div>`;
  el.onclick=e=>{if(e.target.dataset.away)el.innerHTML=""}}
resize();catchUp();hud();if(S.dead)showGameOver();setInterval(()=>{try{bunkTick()}catch(e){console.warn("bunker",e)}},1000);
if(!S.log.length){S.log=["You start with nothing. Tap a city, open Jobs & home, rent a room and apply for work."];hud()}
if(!world)toast("Map outline didn't load. Cities still work.");
})();
</script>
