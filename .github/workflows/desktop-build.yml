# Builds the Meridian desktop app for Mac and Windows when started by hand
# (Actions tab -> "Desktop app build" -> Run workflow). Nothing is published:
# the installers appear as downloadable artifacts on the run.
# Signing is used only when the secrets below exist; otherwise builds are unsigned.
name: Desktop app build
on: workflow_dispatch
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            cmd: dist:mac
          - os: windows-latest
            cmd: dist:win
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - shell: bash
        run: |
          # No certificate saved yet: build unsigned instead of failing.
          if [ -z "$CSC_LINK" ]; then unset CSC_LINK CSC_KEY_PASSWORD; export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          npm run ${{ matrix.cmd }}
        env:
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.MAC_CERT_P12_BASE64 || secrets.WIN_CERT_PFX_BASE64 }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.MAC_CERT_PASSWORD || secrets.WIN_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: meridian-${{ matrix.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
