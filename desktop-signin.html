<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meridian - sign in for the desktop app</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1020;color:#e6ebf5;font:16px system-ui,sans-serif;text-align:center;padding:16px;box-sizing:border-box}
button{margin-top:16px;padding:12px 24px;font-size:16px;border:0;border-radius:8px;background:#3b82f6;color:#fff;cursor:pointer}#m{margin-top:14px;color:#9fb0cf}</style></head>
<body><div><h1>Sign in to the Meridian app</h1><p>Google doesn't allow its sign-in inside apps, so we do it here in your browser.</p>
<button id="b">Sign in with Google</button><div id="m"></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
// Same public web config as index.html.
firebase.initializeApp({apiKey:"AIzaSyCDtjXQ_Mn41j6tvTl92T31WHkyUda9VbA",authDomain:"meridian-world-players.firebaseapp.com",projectId:"meridian-world-players",appId:"1:940610754629:web:51ac000183beb19a8deb2c"});
const m=document.getElementById("m");
document.getElementById("b").onclick=async()=>{m.textContent="Opening Google...";
  try{const r=await firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider());const c=r.credential||{};
    const q=new URLSearchParams({id:c.idToken||"",at:c.accessToken||""});
    try{await firebase.auth().signOut()}catch(e){}
    m.textContent="Done. Switching back to the Meridian app... You can close this tab.";
    location.href="meridian://auth?"+q.toString();
  }catch(e){m.textContent=String(e&&e.message||e).replace(/^Firebase:\s*/,"")}};
</script></body></html>
