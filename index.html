<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Meridian Tycoon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;600&family=Figtree:wght@400;600&display=swap">
<style>
/* Layout: full-bleed chart-table map, ledger strip on top, city sheet slides up from bottom */
:root{
  --sea:#d9e4e1; --land:#f3efe2; --border:#b9b29a; --ink:#1d2a2b; --muted:#5f6e6c;
  --accent:#c2410c; --own:#0f766e; --space:#c3d0cc; --panel:#fbfaf5; --line:#d6d1bf; --good:#15803d; --bad:#b91c1c;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --sea:#0e1a1d; --land:#1f2b2a; --border:#3c4a46; --ink:#e8ece6; --muted:#97a6a1;
  --accent:#fb923c; --own:#2dd4bf; --space:#070d0f; --panel:#141f21; --line:#2c3a38; --good:#4ade80; --bad:#f87171; color-scheme:dark}}
:root[data-theme="dark"]{
  --sea:#0e1a1d; --land:#1f2b2a; --border:#3c4a46; --ink:#e8ece6; --muted:#97a6a1;
  --accent:#fb923c; --own:#2dd4bf; --space:#070d0f; --panel:#141f21; --line:#2c3a38; --good:#4ade80; --bad:#f87171; color-scheme:dark}
html,body{height:100%}
body{background:var(--sea);color:var(--ink);font-family:var(--body);overflow:hidden}
#app{position:relative;height:100%;display:flex;flex-direction:column}
header{background:var(--panel);border-bottom:1px solid var(--line);padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;gap:14px;align-items:center}
.brand{margin-right:auto;min-width:0}
.brand small{display:block;font-family:var(--mono);font-size:10px;color:var(--muted);white-space:nowrap}
.brand small b{font-weight:600;color:var(--ink)}
h1{font-family:var(--display);font-weight:800;font-size:20px;margin:0;letter-spacing:-.02em;line-height:1.1}
.stat.cash b{font-size:17px}
header>*{flex:none}.brand{flex:1 1 auto}
@media (max-width:440px){header .stat.nwst{display:none}header{gap:12px}.brand small span{display:none}}
h1 span{color:var(--accent)}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--mono);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.stat small{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
#mapwrap{position:relative;flex:1;min-height:0}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas#map:active{cursor:grabbing}
#ticker{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:10px;right:max(12px,env(safe-area-inset-right,0px));
  font-size:12px;font-family:var(--mono);color:var(--ink);display:flex;flex-direction:column;align-items:flex-start;gap:4px}
#ticker button{all:unset;cursor:pointer;background:var(--panel);padding:5px 10px;border:1px solid var(--line);border-radius:999px;max-width:100%;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 1px 3px rgba(0,0,0,.08);box-sizing:border-box}
#ticker button::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:7px;vertical-align:1px}
#ticker div{background:var(--panel);padding:5px 10px;border:1px solid var(--line);border-radius:8px;max-width:100%;box-sizing:border-box;color:var(--muted)}
#hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted);pointer-events:none}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:58%;overflow:auto;overscroll-behavior:contain;background:var(--panel);
  border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.14);
  padding-block:0 20px;transition:transform .25s ease,max-height .25s ease;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  transform:translateY(105%)}
#sheet.open{transform:none}
#sheet.full{max-height:calc(100% - 8px)}
@media (min-width:820px){#sheet{left:auto;width:420px;top:0;max-height:none;border-radius:0;border-left:1px solid var(--line);transform:translateX(105%)}#sheet.open{transform:none}.grab{display:none!important}}
.shead{display:flex;align-items:start;gap:10px;padding-top:4px}
.shead h2{font-family:var(--display);font-size:24px;margin:0;letter-spacing:-.02em;text-wrap:balance}
.shead p{margin:2px 0 0;color:var(--muted);font-size:13px}
.x{margin-left:auto;flex:none;background:var(--line);border:0;color:var(--ink);border-radius:50%;width:32px;height:32px;font-size:18px;line-height:1;cursor:pointer}
.meta{display:flex;gap:16px;margin:10px 0 12px;font-family:var(--mono);font-size:12px}
.meta span{color:var(--muted)}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.row .n{font-weight:600}
.row .d{min-width:0;font-size:12.5px;line-height:1.45;color:var(--muted);grid-column:1}
.row .d b{font-family:var(--mono);color:var(--ink);font-weight:600}
.row button{grid-row:1/3;grid-column:2}
button.buy{font-family:var(--mono);font-weight:600;font-size:12.5px;min-height:36px;padding:7px 12px;border-radius:8px;border:1.5px solid var(--ink);background:var(--ink);color:var(--panel);cursor:pointer;min-width:96px;line-height:1.2;transition:transform .08s}
button.buy:not(:disabled):active{transform:scale(.97)}
button.buy.up{background:transparent;color:var(--ink)}
button.buy:disabled{opacity:.32;cursor:not-allowed}
button.buy.up{border-color:var(--line)}button.buy.up:not(:disabled):hover{border-color:var(--ink)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sec{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--ink);margin:22px 0 2px;display:flex;align-items:center;gap:8px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.tag{font-family:var(--mono);font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:999px;margin-left:6px;white-space:nowrap;display:inline-block;vertical-align:1px}
.tag.boom{background:var(--good);color:var(--panel)} .tag.bust{background:var(--bad);color:var(--panel)}
.foot{display:flex;gap:8px;margin-top:14px}
.foot button{font-size:12px;background:none;border:1px solid var(--line);color:var(--muted);padding:6px 10px;border-radius:4px;cursor:pointer}
#toast{position:absolute;z-index:5;left:50%;bottom:20px;border-radius:999px!important;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:4px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#sheet{transition:none}}
.ctl{display:flex;gap:6px;align-items:center;width:100%}
@media (min-width:700px){.ctl{width:auto}}
.ctl button{font-family:var(--mono);font-size:12px;font-weight:600;padding:6px 10px;border-radius:4px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.ctl button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.ctl .pf{margin-left:auto;background:var(--accent);color:var(--panel);border-color:var(--accent)}
.spark{width:100%;height:64px;display:block;margin:6px 0 2px}
.goal{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}
.goal .d{font-size:12px;color:var(--muted)}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;grid-column:1}
.bar i{display:block;height:100%;background:var(--own)}
.goal.done{opacity:.5}
input#q{width:100%;box-sizing:border-box;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink);margin-top:6px}
.row.link{cursor:pointer}
.needs{display:grid;grid-template-columns:repeat(3,22px);gap:3px 4px;align-items:center;background:none;border:0;padding:0;cursor:pointer;color:var(--muted)}
.needs span{display:block;height:6px;background:var(--line);border-radius:3px;overflow:hidden}.needs i{display:block;height:100%}
.needs small{grid-column:1/-1;font-size:9px;text-transform:uppercase;letter-spacing:.06em}
.tabs{display:flex;gap:4px;margin:8px 0 4px;overflow-x:auto;scrollbar-width:none;position:sticky;top:20px;z-index:2;background:var(--panel);padding-block:6px;box-shadow:0 6px 8px -8px rgba(0,0,0,.18)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;font:inherit;font-size:13px;font-weight:600;padding:8px 10px;border:0;background:var(--line);color:var(--muted);border-radius:999px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.row label{white-space:nowrap}
#nav{display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));position:relative;z-index:6}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 7px;background:none;border:0;color:var(--muted);font:600 11px var(--body);cursor:pointer}
#nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#nav button[aria-current="true"]{color:var(--accent)}
.grab{position:sticky;top:0;z-index:3;display:flex;justify-content:center;align-items:center;height:20px;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 0;background:var(--panel);cursor:grab;touch-action:none;border:0;width:calc(100% + 2*max(16px,env(safe-area-inset-left,0px)));padding:0}
.grab::before{content:"";width:40px;height:5px;border-radius:3px;background:var(--line)}
.welcome{background:var(--ink);color:var(--panel);padding:10px 12px;border-radius:4px;font-size:13px;margin-bottom:10px}
</style>
</head>

<div id="app">
  <header>
    <div class="brand"><h1>Meridian<span>.</span></h1><small><b id="day">--:--</b><span> · <span id="clk">Local time</span></span></small></div>

</div>

<script>
/* stub so the ECharts world geometry script hands its data to us */
window.echarts={registerMap:function(n,g){window.__WORLD=g}};
</script>
<script src="https://cdn.jsdelivr.net/npm/echarts@4.9.0/map/js/world.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const fmt=n=>{const a=Math.abs(n),s=n<0?"-$":"$";
  if(a>=1e9)return s+(a/1e9).toFixed(2)+"B";if(a>=1e6)return s+(a/1e6).toFixed(2)+"M";if(a>=1e4)return s+(a/1e3).toFixed(1)+"K";return s+Math.round(a).toLocaleString()};

/* ---------- world geometry ---------- */
function decodeRing(c,off,sc){const r=[];let px=off[0],py=off[1];
  for(let i=0;i<c.length;i+=2){let x=c.charCodeAt(i)-64,y=c.charCodeAt(i+1)-64;x=(x>>1)^(-(x&1));y=(y>>1)^(-(y&1));x+=px;y+=py;px=x;py=y;r.push([x/sc,y/sc])}return r}
let world=null;
try{const g=window.__WORLD;if(g){const sc=g.UTF8Scale||1024;
  g.features.forEach(f=>{const G=f.geometry,eo=G.encodeOffsets;if(!g.UTF8Encoding||!eo)return;
    if(G.type==="Polygon")G.coordinates=G.coordinates.map((r,i)=>decodeRing(r,eo[i],sc));
    else G.coordinates=G.coordinates.map((p,i)=>p.map((r,j)=>decodeRing(r,eo[i][j],sc)));
    delete G.encodeOffsets});
  // echarts rings are clockwise in screen space; d3 wants the opposite for small areas
  g.features.forEach(f=>{const G=f.geometry;const fix=r=>{if(d3.geoArea({type:"Polygon",coordinates:[r]})>2*Math.PI)r.reverse();return r};
    if(G.type==="Polygon")G.coordinates=G.coordinates.map(fix);else G.coordinates=G.coordinates.map(p=>p.map(fix))});
  world=g}}catch(e){world=null}

/* ---------- cities: [name, country, lon, lat, size 1-5] ---------- */
const CITIES=[
["Montréal","Canada",-73.57,45.50,3],["Toronto","Canada",-79.38,43.65,4],["Vancouver","Canada",-123.12,49.28,3],
["New York","USA",-74.0,40.71,5],["Los Angeles","USA",-118.24,34.05,5],["Chicago","USA",-87.63,41.88,4],["Miami","USA",-80.19,25.76,3],["Houston","USA",-95.37,29.76,4],
["Mexico City","Mexico",-99.13,19.43,4],["Bogotá","Colombia",-74.07,4.71,3],["Lima","Peru",-77.04,-12.05,3],["São Paulo","Brazil",-46.63,-23.55,5],["Buenos Aires","Argentina",-58.38,-34.6,4],
["London","UK",-0.13,51.51,5],["Paris","France",2.35,48.86,5],["Madrid","Spain",-3.7,40.42,4],["Berlin","Germany",13.4,52.52,4],["Rome","Italy",12.5,41.9,3],["Amsterdam","Netherlands",4.9,52.37,3],["Stockholm","Sweden",18.07,59.33,3],["Warsaw","Poland",21.01,52.23,3],["Istanbul","Türkiye",28.98,41.01,4],
["Cairo","Egypt",31.24,30.04,4],["Lagos","Nigeria",3.38,6.52,4],["Nairobi","Kenya",36.82,-1.29,3],["Johannesburg","South Africa",28.05,-26.2,3],["Casablanca","Morocco",-7.59,33.57,2],
["Dubai","UAE",55.27,25.2,4],["Riyadh","Saudi Arabia",46.68,24.71,3],["Mumbai","India",72.88,19.08,5],["Delhi","India",77.21,28.61,5],["Bangkok","Thailand",100.5,13.76,4],["Singapore","Singapore",103.82,1.35,4],["Jakarta","Indonesia",106.85,-6.21,4],["Manila","Philippines",120.98,14.6,3],
["Hong Kong","China",114.17,22.32,4],["Shanghai","China",121.47,31.23,5],["Beijing","China",116.4,39.9,5],["Seoul","South Korea",126.98,37.57,4],["Tokyo","Japan",139.69,35.69,5],
["Sydney","Australia",151.21,-33.87,4],["Melbourne","Australia",144.96,-37.81,3],["Auckland","New Zealand",174.76,-36.85,2],["Reykjavík","Iceland",-21.94,64.15,1],["Anchorage","USA",-149.9,61.22,1],
["Perth","Australia",115.86,-31.95,3],["Kalgoorlie","Australia",121.47,-30.75,1,["ore","sand"]],["Newcastle","Australia",151.78,-32.93,1,["coal","sand"]],["Saskatoon","Canada",-106.67,52.13,1,[]],["Sudbury","Canada",-80.99,46.49,1,["ore"]],["Des Moines","USA",-93.61,41.59,2,[]],["Pittsburgh","USA",-79.99,40.44,2,["coal"]],["Santiago","Chile",-70.67,-33.45,3,["sand"]],["Antofagasta","Chile",-70.4,-23.65,1,["ore","sand"]],["Fort McMurray","Canada",-111.38,56.73,1,["oil","sand"]],["Midland","USA",-102.08,31.99,1,["oil"]],["Kirkuk","Iraq",44.39,35.47,2,["oil"]],["Port Harcourt","Nigeria",7.01,4.82,2,["oil"]],["Lubumbashi","DR Congo",27.48,-11.66,1,["ore","coal"]],["Ulaanbaatar","Mongolia",106.91,47.89,1,["coal","ore"]],["Ruhr (Essen)","Germany",7.01,51.46,2,["coal"]],["Kiruna","Sweden",20.23,67.86,1,["ore"]],["Ludhiana","India",75.86,30.9,2,[]]
].map((c,i)=>({id:i,name:c[0],country:c[1],lon:c[2],lat:c[3],size:c[4],dep:c[5]}));

/* land price multiplier and customer demand per city size */
const PRICE=[0,0.6,0.8,1,1.35,1.8], DEMAND=[0,0.7,0.85,1,1.25,1.6];

/* business types: cost, gross/day, upkeep/day */
const BIZ=[
 {k:"cart",n:"Food cart",d:"Street food. Cheap and quick to pay back.",cost:1500,gross:260,up:60},
 {k:"kiosk",n:"Coffee kiosk",d:"Commuter traffic, steady margins.",cost:6000,gross:820,up:240},
 {k:"shop",n:"Corner shop",d:"Groceries and everyday goods.",cost:18000,gross:2200,up:700},
 {k:"rest",n:"Restaurant",d:"Staffed kitchen, big tickets.",cost:55000,gross:6200,up:2100},
 {k:"apt",n:"Apartment block",d:"Rent from 24 units. Low upkeep.",cost:140000,gross:9800,up:1900},
 {k:"office",n:"Office tower",d:"Corporate leases. Slow, huge payback.",cost:600000,gross:36000,up:8000},
 {k:"hotel",n:"Hotel",d:"Tourist money. Best in size-5 cities.",cost:1800000,gross:115000,up:34000},
 {k:"casino",n:"Casino",d:"Company-only: you need an HQ in this city. Huge takings, huge payroll.",cost:3500000,gross:210000,up:70000,co:1}
];
const MAXLV=5;

/* ---------- state ---------- */
const DAYMS=3600000, BASEKEY="meridian-tycoon-v1", SLOTKEY="meridian-active-slot";
const slotKey=n=>n===1?BASEKEY:BASEKEY+"-s"+n; // slot 1 is the original save
let SLOT=1;try{SLOT=+localStorage.getItem(SLOTKEY)||1}catch(e){}
const KEY=slotKey(SLOT);
let S={cash:0,day:1,own:{},events:{},log:[],hist:[],goals:[],mgr:{},speed:1,debt:0,rivals:null,last:Date.now(),earned:0}; // own[cityId][bizKey]=level
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

const cost=(b,c)=>Math.round(b.cost*PRICE[c.size]);
const upCost=(b,c,lv)=>Math.round(cost(b,c)*0.7*Math.pow(1.6,lv-1));
function evMult(c){const e=S.events[c.id];return e?e.m:1}
/* rival companies */
const RIVALS=[{n:"Halcyon Group",col:"#7c3aed"},{n:"Ironbridge Co.",col:"#b45309"},{n:"Sable & Finch",col:"#0369a1"}];
if(!S.rivals)S.rivals=RIVALS.map((r,i)=>({nw:40000+i*25000,cities:[[3,13,40],[29,36,11],[14,31,23]][i]}));
const rivalsIn=c=>S.rivals.reduce((n,r)=>n+(r.cities.includes(c.id)?1:0),0);
const compMult=c=>1-0.15*rivalsIn(c);
const buyoutCost=c=>Math.round(30000*PRICE[c.size]*(1+S.day/40));
const mgrCost=c=>Math.round(20000*PRICE[c.size]);
const bonus=(b,c)=>b.k==="hotel"&&c.size>=4?1.3:b.k==="apt"&&c.size<=2?1.25:1;
const USE={cart:{burgers:2},kiosk:{bread:3},shop:{bread:4,tools:1},rest:{burgers:5,beef:3},office:{electronics:.5},hotel:{bread:8,electronics:.5}};
const supFrac=(c,b)=>USE[b.k]?((S.sup||{})[c.id]||{})[b.k]||0:0;
function profit(b,c,lv){return Math.round(b.gross*(1+Math.min(.5,(S.sats||0)*.005))*(hasTech("mars")?1.25:1)*(1+.35*supFrac(c,b))*bonus(b,c)*compMult(c)*DEMAND[c.size]*evMult(c)*(S.mgr[c.id]?1.2:1)*(typeof burnout==="function"?burnout():1)*((S.bonus||{})[c.id]?1.08:1)*(1+0.55*(lv-1))-b.up*PRICE[c.size]*((S.bonus||{})[c.id]?1.25:1)*(1+0.3*(lv-1)))}
function cityProfit(c){const o=S.own[c.id]||{};let t=0;for(const b of BIZ)if(o[b.k])t+=profit(b,c,o[b.k]);return t}
/* renting: anything you don't own pays hourly rent (value / 40 per hour, so buying pays for itself in under 2 days of rent) */
const RENT=1/40,FIT=.2;
const isLeased=(c,k)=>!!((S.lease||{})[c.id]||{})[k];
const bizRent=(b,c)=>Math.round(cost(b,c)*RENT);
function rentTotal(){let r=0;for(const id in S.lease||{})for(const k in S.lease[id]){if(!S.lease[id][k]||!(S.own[id]||{})[k])continue;r+=bizRent(BIZ.find(b=>b.k===k),CITIES[id])}
  for(const s of S.sites||[])if(s.lease)r+=Math.round(plotPrice(CITIES[s.city],zoneOf(s)||"farm",s.size)*RENT);return r}
function totals(){let inc=0,assets=0;
  for(const c of CITIES){const o=S.own[c.id];if(!o)continue;
    for(const b of BIZ){const lv=o[b.k];if(!lv)continue;inc+=profit(b,c,lv);
      let v=isLeased(c,b.k)?cost(b,c)*FIT:cost(b,c);for(let l=1;l<lv;l++)v+=upCost(b,c,l);assets+=v*0.75}}
  const interest=Math.round(S.debt*0.002);
  const upk=typeof indUpkeep==="function"?indUpkeep():0;assets+=typeof indAssets==="function"?indAssets():0;
  const rent=rentTotal();if(typeof lifeIncome==="function"){inc+=lifeIncome();assets+=lifeAssets()}if(typeof propIncome==="function"){inc+=propIncome();assets+=propAssets()}if(typeof hqTotalUpkeep==="function"){inc-=hqTotalUpkeep();for(const id in S.hq)if(S.hq[id])assets+=hqCost(CITIES[id])*.6}
  return{inc:inc-interest-upk-rent,interest,upk,rent,nw:S.cash+assets-S.debt}}

/* ---------- map: a 3D globe you can spin 360° in any direction ---------- */
const cv=$("#map"),ctx=cv.getContext("2d");
let W=0,H=0,dpr=1,base=200;
const proj=d3.geoOrthographic().clipAngle(90).precision(.3);
const path=d3.geoPath(proj,ctx);
const V={lam:75,phi:-30,k:1,vl:0,vp:0};           // rotation (deg), zoom, spin velocity
let T={k:1},sel=null;
const sheetUp=()=>sheet.classList.contains("open")&&!matchMedia("(min-width:820px)").matches;
function applyView(){T.k=V.k;proj.rotate([V.lam,V.phi]).scale(base*V.k);
  const wide=matchMedia("(min-width:820px)").matches&&sheet.classList.contains("open");
  proj.translate([wide?(W-420)/2:W/2,sheetUp()?Math.min(H*.32,H/2):H/2])}
function resize(){const r=cv.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=W*dpr;cv.height=H*dpr;base=Math.min(W,H)/2-16;draw()}
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const visible=(lon,lat)=>d3.geoDistance([lon,lat],[-V.lam,-V.phi])<Math.PI/2-.03;
function draw(){applyView();
  const C={sea:css("--sea"),land:css("--land"),border:css("--border"),ink:css("--ink"),own:css("--own"),acc:css("--accent"),good:css("--good"),bad:css("--bad"),muted:css("--muted"),space:css("--space")};
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle=C.space;ctx.fillRect(0,0,W,H);
  const [cx,cy]=proj.translate(),R=proj.scale();
  // atmosphere glow
  const glow=ctx.createRadialGradient(cx,cy,R*.98,cx,cy,R*1.12);glow.addColorStop(0,"rgba(120,190,210,.35)");glow.addColorStop(1,"rgba(120,190,210,0)");
  ctx.fillStyle=glow;ctx.beginPath();ctx.arc(cx,cy,R*1.12,0,7);ctx.fill();
  // ocean with a soft light from the upper left
  const sea=ctx.createRadialGradient(cx-R*.35,cy-R*.4,R*.1,cx,cy,R);sea.addColorStop(0,C.sea);sea.addColorStop(1,C.border);
  ctx.beginPath();path({type:"Sphere"});ctx.fillStyle=C.sea;ctx.fill();ctx.globalAlpha=.35;ctx.fillStyle=sea;ctx.fill();ctx.globalAlpha=1;
  ctx.beginPath();path(d3.geoGraticule10());ctx.strokeStyle=C.border;ctx.globalAlpha=.3;ctx.lineWidth=.5;ctx.stroke();ctx.globalAlpha=1;
  if(world){ctx.beginPath();path(world);ctx.fillStyle=C.land;ctx.fill();ctx.strokeStyle=C.border;ctx.lineWidth=.6;ctx.stroke()}
  // terminator-style shading toward the limb for depth
  const limb=ctx.createRadialGradient(cx,cy,R*.55,cx,cy,R);limb.addColorStop(0,"rgba(0,0,0,0)");limb.addColorStop(1,"rgba(0,0,0,.22)");
  ctx.beginPath();path({type:"Sphere"});ctx.fillStyle=limb;ctx.fill();ctx.strokeStyle=C.border;ctx.lineWidth=1;ctx.stroke();
  // shipments in transit (great-circle routes, clipped to the visible side)
  const now=Date.now();
  for(const v of S.fleet){if(!v.arr)continue;const a=CITIES[v.from],b=CITIES[v.dest],t=Math.min(1,(now-v.dep)/(v.arr-v.dep));
    ctx.beginPath();path({type:"LineString",coordinates:[[a.lon,a.lat],[b.lon,b.lat]]});ctx.setLineDash([4,4]);ctx.strokeStyle=C.acc;ctx.lineWidth=1.4;ctx.stroke();ctx.setLineDash([]);
    const g=d3.geoInterpolate([a.lon,a.lat],[b.lon,b.lat])(t);if(!visible(g[0],g[1]))continue;const [x,y]=proj(g);
    ctx.fillStyle=C.acc;if(v.type==="truck")ctx.fillRect(x-4,y-3,8,6);else if(v.type==="ship"){ctx.beginPath();ctx.moveTo(x-6,y-2);ctx.lineTo(x+6,y-2);ctx.lineTo(x+3,y+3);ctx.lineTo(x-3,y+3);ctx.fill()}
    else{ctx.beginPath();ctx.moveTo(x,y-5);ctx.lineTo(x+5,y+4);ctx.lineTo(x-5,y+4);ctx.fill()}}
  // cities on the near side only
  ctx.textBaseline="middle";
  for(const c of CITIES){if(!visible(c.lon,c.lat)){c.sx=c.sy=-1e4;continue}const [x,y]=proj([c.lon,c.lat]);c.sx=x;c.sy=y;
    const edge=1-Math.min(1,d3.geoDistance([c.lon,c.lat],[-V.lam,-V.phi])/(Math.PI/2))*.6;   // fade toward the horizon
    ctx.globalAlpha=Math.max(.35,edge);
    const owned=(S.own[c.id]&&Object.keys(S.own[c.id]).length)||hasWh(c);const r=(2.5+c.size*.9)*Math.min(1.6,.85+V.k*.08);
    const ev=S.events[c.id];
    S.rivals.forEach((rv,i)=>{if(rv.cities.includes(c.id)){ctx.fillStyle=RIVALS[i].col;ctx.fillRect(x-r-6-i*6,y+r+2,5,5)}});
    if(ev){ctx.beginPath();ctx.arc(x,y,r+5,0,7);ctx.strokeStyle=ev.m>1?C.good:C.bad;ctx.lineWidth=1.5;ctx.stroke()}
    ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle=owned?C.own:C.ink;ctx.fill();
    if(sel===c){ctx.beginPath();ctx.arc(x,y,r+9,0,7);ctx.strokeStyle=C.acc;ctx.lineWidth=2.5;ctx.stroke()}
    if(V.k>1.8||c.size>=5||owned){ctx.font=(owned?"600 ":"")+"12px Figtree, system-ui, sans-serif";ctx.fillStyle=owned?C.own:C.ink;
      const cp=cityProfit(c)+S.sites.filter(st=>st.city===c.id&&siteOp(st)).reduce((a,st)=>a+siteEst(st),0);ctx.fillText(c.name+(owned&&cp?"  "+fmt(cp)+"/hr":""),x+r+4,y)}}
  ctx.globalAlpha=1}
/* drag to spin (with momentum), pinch or scroll to zoom, tap a city */
const ptrs=new Map();let dragMoved=false,pinch0=null,lastMove=0,spinRaf=0;
const degPerPx=()=>180/Math.PI/proj.scale();
function clampPhi(){V.phi=Math.max(-89,Math.min(89,V.phi))}
cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});dragMoved=false;V.vl=V.vp=0;cancelAnimationFrame(spinRaf);flying=false;
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch0={d:Math.hypot(a.x-b.x,a.y-b.y),k:V.k}}});
cv.addEventListener("pointermove",e=>{const p=ptrs.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;
  if(ptrs.size===1){if(Math.abs(dx)+Math.abs(dy)>2)dragMoved=true;const f=degPerPx();V.lam+=dx*f;V.phi-=dy*f;clampPhi();
    const t=performance.now(),dt=Math.max(8,t-lastMove);V.vl=dx*f/dt*16;V.vp=-dy*f/dt*16;lastMove=t;draw()}
  p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===2&&pinch0){dragMoved=true;const [a,b]=[...ptrs.values()];V.k=Math.max(.8,Math.min(30,pinch0.k*Math.hypot(a.x-b.x,a.y-b.y)/pinch0.d));draw()}});
function spin(){V.vl*=.94;V.vp*=.94;V.lam+=V.vl;V.phi+=V.vp;clampPhi();draw();if(Math.abs(V.vl)+Math.abs(V.vp)>.02)spinRaf=requestAnimationFrame(spin)}
const endPtr=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch0=null;
  if(!ptrs.size&&dragMoved&&!reduce&&performance.now()-lastMove<80&&Math.abs(V.vl)+Math.abs(V.vp)>.05){cancelAnimationFrame(spinRaf);spinRaf=requestAnimationFrame(spin)}};
cv.addEventListener("pointerup",endPtr);cv.addEventListener("pointercancel",endPtr);
cv.addEventListener("wheel",e=>{e.preventDefault();V.k=Math.max(.8,Math.min(30,V.k*Math.exp(-e.deltaY*.0015)));draw()},{passive:false});
cv.addEventListener("click",e=>{if(dragMoved)return;const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  let best=null,bd=26*26;for(const c of CITIES){const d=(c.sx-x)**2+(c.sy-y)**2;if(d<bd){bd=d;best=c}}
  if(best)openCity(best)});
/* glide the globe so a city faces you */
let flying=false;
function rotateTo(c,k,done){const l0=V.lam,p0=V.phi,k0=V.k;let l1=-c.lon;while(l1-l0>180)l1-=360;while(l1-l0<-180)l1+=360;const p1=Math.max(-80,Math.min(80,-c.lat));
  if(reduce){V.lam=l1;V.phi=p1;V.k=k;draw();done&&done();return}
  const t0=performance.now();flying=true;cancelAnimationFrame(spinRaf);
  const step=t=>{if(!flying)return;const u=Math.min(1,(t-t0)/750),e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;V.lam=l0+(l1-l0)*e;V.phi=p0+(p1-p0)*e;V.k=k0+(k-k0)*e;draw();
    if(u<1)requestAnimationFrame(step);else{flying=false;done&&done()}};requestAnimationFrame(step)}

function shipDests(c,v){return CITIES.filter(d=>d!==c&&hasWh(d)&&(v.type!=="truck"||landmass(d)===landmass(c)))}
function shipFormHtml(c,v){const inv=S.inv[c.id]||{},V=VEH[v.type],ds=shipDests(c,v);

   <label>Bring back on the return leg <select id="sf-b" style="width:100%;font:inherit;padding:6px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px"><option value="">Nothing</option>${GK.map(g=>`<option value="${g}">${G[g][0]}</option>`).join("")}</select></label>
   <div id="sf-info" class="d" style="color:var(--muted)"></div>
   <button class="buy" data-act="go" data-id="${v.id}">Load up to ${V.cap} and go</button></div>`}
function shipInfo(){const i=$("#sf-info");if(!i||!sel)return;const v=S.fleet.find(x=>x.id===shipForm);if(!v)return;const V=VEH[v.type],d=CITIES[+$("#sf-d").value],g=$("#sf-g").value,c=sel;
  const km=distKm(c,d),fuel=km*V.km,q=g?Math.min(V.cap,(S.inv[c.id]||{})[g]||0):0;
  i.innerHTML=`Fuel ${fmt(fuel)} · arrives in ${fmtDur(km/V.spd*DAYMS)}${g?` · ${Math.floor(q)} ${G[g][0].toLowerCase()} sells for ${fmt(px(d,g))} there vs ${fmt(px(c,g))} here (${px(d,g)*q-px(c,g)*q-fuel>=0?"+":""}${fmt(px(d,g)*q-px(c,g)*q-fuel)} trip profit)`:""}`}
sheet.addEventListener("change",e=>{const t=e.target;if(t.id==="sf-g"||t.id==="sf-d")shipInfo();
  if(t.dataset.act==="auto"&&sel){(S.auto[sel.id]=S.auto[sel.id]||{})[t.dataset.g]=t.checked;save();toast(t.checked?`Auto-selling ${G[t.dataset.g][0].toLowerCase()} in ${sel.name}`:"Auto-sell off")}});
sheet.addEventListener("click",e=>{const b=e.target.closest("[data-tab],[data-act]");if(!b||b.tagName==="INPUT")return;
  if(b.dataset.tab){tab=b.dataset.tab;shipForm=null;renderSheet();return}

  else if(a==="build"){const s=S.sites.find(x=>x.id===id),o=OP[$("#op-"+id).value],p=o.build*LAND[s.size][1];if(S.cash<p){toast(`Need ${fmt(p)} to build that`);return}S.cash-=p;s.op=o.k;s.k=null;toast(`${o.n} built`)}

  else if(a==="leaseland"){const k=b.dataset.k,z=b.dataset.z;S.sites.push({id:S.nid++,city:c.id,size:k,type:z,op:null,lease:1});ensureWh(c);toast(`Renting ${LAND[k][1]} ha of ${ZONE[z].n.toLowerCase()} in ${c.name}`)}
  else if(a==="ownland"){const s=S.sites.find(x=>x.id===id),p=plotPrice(c,zoneOf(s)||"farm",s.size);if(S.cash<p){toast(`Need ${fmt(p)}`);return}S.cash-=p;delete s.lease;toast("Land bought. No more rent.")}

  else if(a==="wh"){const p=whCost(c);if(S.cash<p)return;S.cash-=p;ensureWh(c);toast(`Warehouse open in ${c.name}`)}
  else if(a==="whup"){const p=whUp(c);if(S.cash<p)return;S.cash-=p;S.wh[c.id]++;toast("Warehouse expanded")}
  else if(a==="sell"){if(G[b.dataset.g][2]==="gov"&&!govOK(c)){toast(hasTech("govlic")?"Government buyers are only in cities of size 4+":"Research the Defense contractor licence to sell this");return}if(G[b.dataset.g][2]==="gov"&&!hasHQ(c)){toast("Government contracts need a registered company: open an HQ here");return}const g=b.dataset.g,street=!hasHQ(c),q=street?Math.min(20,S.inv[c.id][g]||0):(S.inv[c.id][g]||0),v=sellGood(c,g,q)*(street?.7:1);S.cash+=v;S.earned=(S.earned||0)+v;S.inv[c.id][g]-=q;if(S.inv[c.id][g]<1e-6)delete S.inv[c.id][g];toast(`Sold ${gq(q)} ${G[g][0].toLowerCase()} for ${fmt(v)}`)}

  else if(a==="ship"){shipForm=shipForm===id?null:id;renderSheet();shipInfo();return}

    if(S.cash<fuel){toast(`Need ${fmt(fuel)} for fuel`);return}S.cash-=fuel;
    S.cash+=fuel;depart(v,c,d,g);const rep=$("#sf-r")&&$("#sf-r").checked;v.route=rep&&g?{from:c.id,to:d.id,g,back:$("#sf-b").value}:null;
    shipForm=null;toast(rep&&g?`Route set: ${c.name} ⇄ ${d.name}`:`${V.n} #${v.id} left for ${d.name}`)}

  else return;
  commit()});

/* ---------- jobs & housing: how a new player earns their first money ---------- */
S.exp=S.exp||0;
const COL=c=>.7+.3*PRICE[c.size]; // cost-of-living scaling for wages and rent
const JOBS=[
 {k:"dish",n:"Dishwasher",w:10,exp:0,d:"Back-of-house at a busy diner."},
 {k:"cashier",n:"Cashier",w:12,exp:0,d:"Grocery checkout, evening shifts."},
 {k:"courier",n:"Delivery courier",w:13,exp:0,d:"Bike deliveries around downtown."},
 {k:"farmhand",n:"Farm hand",w:11,exp:0,d:"Seasonal field work.",ok:c=>c.size<=2},
 {k:"warehouse",n:"Warehouse worker",w:14,exp:2,d:"Picking and packing orders."},
 {k:"security",n:"Security agent",w:16,exp:5,d:"Site patrols and access control."},
 {k:"miner",n:"Mine worker",w:24,exp:5,d:"Underground shifts. Hard work, good pay.",ok:c=>deps(c).length>0},
 {k:"clerk",n:"Office clerk",w:20,exp:15,d:"Data entry and filing.",ok:c=>c.size>=3},
 {k:"trucker",n:"Truck driver",w:22,exp:20,d:"Regional freight runs."},
 {k:"supervisor",n:"Shift supervisor",w:28,exp:40,d:"Run a team of twelve."},
 {k:"manager",n:"Operations manager",w:38,exp:80,d:"Budgets, staffing and logistics.",ok:c=>c.size>=3}];

const HOMES=[
 {k:"room",n:"Shared room",r:3,buy:0,d:"A room in a shared flat. Cheapest way to get an address."},
 {k:"studio",n:"Studio apartment",r:7,buy:14000,d:"Your own place. Employers like a stable address (+10% chance to get hired)."},
 {k:"house",n:"House",r:18,buy:65000,d:"Room to breathe. Owning one adds to your net worth."}];
const HK=Object.fromEntries(HOMES.map(h=>[h.k,h]));
const jobsIn=c=>JOBS.filter(j=>!j.ok||j.ok(c));
const wage=(j,c)=>Math.round(j.w*COL(c)*100)/100;
const homeRent=(h,c)=>Math.round(h.r*COL(c)*PRICE[c.size]*100)/100;
const homeBuy=(h,c)=>Math.round(h.buy*PRICE[c.size]*PRICE[c.size]);
function lifeIncome(){let v=0;if(S.job)v+=wage(JK[S.job.k],CITIES[S.job.city])*(typeof wageMult==="function"?wageMult():1);if(S.home&&!S.home.own)v-=homeRent(HK[S.home.k],CITIES[S.home.city]);return v}
function lifeAssets(){return S.home&&S.home.own?homeBuy(HK[S.home.k],CITIES[S.home.city])*.9:0}
function hireChance(j){return Math.min(.95,.6+(S.home&&S.home.k!=="room"?.1:0)+Math.min(.25,(S.exp-j.exp)*.01))}
function checkApp(){const a=S.app;if(!a||Date.now()<a.t)return;const j=JK[a.k],c=CITIES[a.city];S.app=null;
  if(Math.random()<a.p){S.job={k:a.k,city:a.city,since:Date.now()};S.log.unshift(`Hired: ${j.n} in ${c.name}, ${fmt(wage(j,c))}/hr`);toast(`You got the job: ${j.n}!`)}
  else{S.log.unshift(`${c.name}: the ${j.n.toLowerCase()} job went to someone else. Apply again.`);toast("Application turned down")}
  S.log=S.log.slice(0,3);save();hud();renderSheet()}
function renderLife(c){let h=cityHead(c);const hm=S.home,jb=S.job;
  h+=`<div class="meta"><div><span>Experience </span>${S.exp.toFixed(1)} h</div><div><span>You </span>${fmt(lifeIncome())}/hr</div></div>`+tabsHtml();

/* ---------- player market: list goods, NPCs buy minute by minute when local stock runs low ---------- */
S.lst=S.lst||[];S.mkt=S.mkt||{};if(!S.mlast)S.mlast=Date.now();
const MIN=60000,LOW=.6,FEE=.02;
const mkey=(c,g)=>c.id+":"+g;
const mT=(c,g)=>Math.max(20,depth(c,g)/3);                                   // units that make a "full" local market
const mCons=(c,g)=>(.004+.002*c.size)*({raw:.7,mid:.8,fin:1.2}[G[g][2]]||1); // share of stock used up per minute
const mRefill=(c,g)=>.008+(((c.id*131+GK.indexOf(g)*17)%97)/97)*.02;         // NPC suppliers restock rate
const mRef=(c,g)=>G[g][1]*cityF(c,g);
function mLevel(c,g,now){const k=mkey(c,g),m=S.mkt[k]||(S.mkt[k]={L:.7,t:now||Date.now()});now=now||Date.now();
  const mins=Math.max(0,(now-m.t)/MIN),kk=mRefill(c,g),eq=1-mCons(c,g)/kk;m.L=Math.min(1,Math.max(0,eq+(m.L-eq)*Math.exp(-kk*mins)));m.t=now;return m.L}
const maxPay=(c,g,L)=>mRef(c,g)*(1+Math.max(0,LOW-L)*1.5);                   // the emptier the shelves, the more buyers pay
const mState=L=>L<.3?["Very low","bust"]:L<LOW?["Low","bust"]:L<.85?["Normal",""]:["Saturated","boom"];
/* dumping on the spot market fills local shelves too */
function mFill(c,g,q){if(G[g][2]==="gov")return;const L=mLevel(c,g);S.mkt[mkey(c,g)].L=Math.min(1,L+q/mT(c,g))}
function runMarket(now){if(!S.lst.length){S.mlast=now;return}
  let mins=Math.min(2880,Math.floor((now-S.mlast)/MIN));if(mins<1)return;const sold={};
  for(let i=1;i<=mins;i++){const t=S.mlast+i*MIN;const keys=[...new Set(S.lst.map(l=>l.city+":"+l.g))];
    for(const key of keys){const [cid,g]=key.split(":"),c=CITIES[+cid];const L=mLevel(c,g,t);if(L>=LOW)continue;
      let want=(.8-L)*mT(c,g)*.25;const cap=maxPay(c,g,L);                    // buyers trickle in: a quarter of the gap each minute
      const offers=S.lst.filter(l=>l.city==cid&&l.g===g&&l.q>0&&l.p<=cap).sort((a,b)=>a.p-b.p);

/* decay per hour without a home; a home pulls each need back up to 85% */
const DECAY={h:1,f:5,m:3};
function runNeeds(hours){const N=S.need;let left=hours;
  while(left>1e-6){const h=Math.min(.25,left);left-=h;
    for(const [k] of NEEDS){let d=-DECAY[k];if(k==="h"){if(N.f<=0)d-=4;if(N.m<=0)d-=1}
      if(S.home&&N[k]<HOMECAP)N[k]=Math.min(HOMECAP,N[k]+15*h);   // home refills toward 85
      else N[k]=Math.max(S.home?HOMECAP:0,N[k]+d*h)}                // above 85 (or homeless) it decays
    if(N.h<=0)hospital()}}
function hospital(){const c=CITIES[(S.home||{city:0}).city],bill=Math.round(500*COL(c));S.cash-=bill;S.need.h=40;
  let lost="";if(S.job&&Math.random()<.5){lost=" You lost your job while you recovered.";S.job=null}
  S.log.unshift(`Collapsed and hospitalized. Bill: ${fmt(bill)}.${lost}`);S.log=S.log.slice(0,3);toast("You were hospitalized")}
const needMin=()=>Math.min(S.need.h,S.need.f,S.need.m);
function wageMult(){const m=needMin();if(m<10)return 0;if(m<25)return .6;if(m<50)return .85;if(m>=95)return 1.1;return 1}
const burnout=()=>S.need&&S.need.m<15?.9:1;
function needsHtml(c){const N=S.need,wm=wageMult();
  let h=`<div class="sec">Your needs</div><div style="display:grid;gap:6px;padding:4px 0 8px">`;
  for(const [k,n] of NEEDS){const v=Math.round(N[k]);h+=`<div style="display:grid;grid-template-columns:56px 1fr 40px;gap:8px;align-items:center;font-size:12px"><span>${n}</span>
    <div class="bar" style="height:8px;grid-column:auto"><i style="width:${v}%;background:${v<25?"var(--bad)":v<50?"var(--accent)":"var(--good)"}"></i></div><b style="font-family:var(--mono);text-align:right">${v}%</b></div>`}
  h+=`<p class="d" style="font-size:12px;color:var(--muted);margin:2px 0 0">${S.home?`Your home keeps each need at ${HOMECAP}% or better. Buy things to top up the rest.`:"No home: every need drains over time. Renting even a room keeps them at "+HOMECAP+"%."}
    ${wm===0?" <b style='color:var(--bad)'>Too unwell to work: no wages until you recover.</b>":wm<1?` <b style="color:var(--bad)">Wages ×${wm} while you're run down.</b>`:wm>1?` <b style="color:var(--good)">All needs above 95%: wages +10%.</b>`:""}${burnout()<1?" <b style='color:var(--bad)'>Burnout: your businesses sell 10% less.</b>":""}</p></div>`;
  h+=`<div class="list">`+["Food","Mind","Health"].map(cat=>ITEMS.filter(i=>i.cat===cat).map(it=>{const p=itemPrice(it,c),fx=NEEDS.filter(([k])=>it[k]).map(([k,n])=>`${it[k]>0?"+":""}${it[k]} ${n.toLowerCase()}`).join(", ");
    return `<div class="row"><div class="n">${it.n}</div><div class="d">${fx}</div><button class="buy up" data-need="${it.k}" ${S.cash<p?"disabled":""}>${fmt(p)}</button></div>`}).join("")).join("")+`</div>`;
  return h}
sheet.addEventListener("click",e=>{const b=e.target.closest("[data-need]");if(!b||!sel)return;const it=ITEMS.find(x=>x.k===b.dataset.need),p=itemPrice(it,sel);if(S.cash<p)return;
  S.cash-=p;for(const [k] of NEEDS)if(it[k])S.need[k]=Math.max(0,Math.min(100,S.need[k]+it[k]));toast(`${it.n}: ${NEEDS.filter(([k])=>it[k]).map(([k,n])=>n+" "+Math.round(S.need[k])+"%").join(", ")}`);commit()});

function simDay(quiet){const{nw}=totals();S.day++;driftPrices();
  audits(quiet);simProps(quiet);
  for(const id in S.iev){if(--S.iev[id].d<=0)delete S.iev[id]}
  if(Math.random()<1-Math.pow(.99,1/24)){const pool=S.sites.length&&Math.random()<.6?[...new Set(S.sites.map(x=>x.city))]:CITIES.map(c=>c.id);const id=pool[Math.floor(Math.random()*pool.length)];
    if(!S.iev[id]){const ks=Object.keys(IEV),t=ks[Math.floor(Math.random()*ks.length)];S.iev[id]={t,d:2+Math.floor(Math.random()*5)};
      if(!quiet&&S.sites.some(x=>x.city==id)){S.log.unshift(`${IEV[t].n} in ${CITIES[id].name} (${S.iev[id].d}h)`);S.log=S.log.slice(0,3)}}}
  if(!quiet)for(const c of CITIES){const p=S.own[c.id]?cityProfit(c):0;if(p)pops.push({c,v:p,t:performance.now()})}
  S.rivals.forEach((r,i)=>{r.nw=Math.round(r.nw*(1.012+Math.random()*.02)+2000);
    if(Math.random()<.12&&r.cities.length<4+Math.floor(r.nw/150000)){const opts=CITIES.filter(c=>!r.cities.includes(c.id));const c=opts[Math.floor(Math.random()*opts.length)];
      r.cities.push(c.id);if(!quiet&&S.own[c.id]){S.log.unshift(`${RIVALS[i].n} opened in your city ${c.name}`);S.log=S.log.slice(0,3)}}});
  S.hist.push(Math.round(nw));if(S.hist.length>60)S.hist.shift();
  for(const id in S.events){if(--S.events[id].d<=0)delete S.events[id]}
  if(Math.random()<.35){const c=CITIES[Math.floor(Math.random()*CITIES.length)];if(!S.events[c.id]){
    const boom=Math.random()<.55;S.events[c.id]={m:boom?1.6:.55,d:3+Math.floor(Math.random()*4)};
    if(!quiet){S.log.unshift(`${new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}: ${boom?"Tourist boom":"Economic slump"} in ${c.name}`);S.log=S.log.slice(0,3)}}}
  return inc}

const adCost=c=>Math.round(6000*PRICE[c.size]+Math.max(0,cityProfit(c))*1.5);
function upgradePlan(c){const o={...S.own[c.id]};let cash=S.cash,cost=0,gain=0;const steps=[];
  for(;;){let best=null;for(const b of BIZ){const lv=o[b.k];if(!lv||lv>=MAXLV)continue;const k=upCost(b,c,lv);if(!best||k<best.k)best={b,k,lv}}
    if(!best||best.k>cash)break;cash-=best.k;cost+=best.k;gain+=profit(best.b,c,best.lv+1)-profit(best.b,c,best.lv);o[best.b.k]++;steps.push([best.b.k])}
  return{n:steps.length,cost,gain,steps}}
const loanLimit=()=>{let a=0;if(!S.job&&!nOwnedSafe())return 0;for(const id in S.own)for(const b of BIZ){const lv=S.own[id][b.k];if(lv)a+=cost(b,CITIES[id])*lv}return Math.round(Math.max(S.job?wage(JK[S.job.k],CITIES[S.job.city])*150:0,a*.5))};

  $("#borrow").onclick=()=>{const a=loanStep();if(a<1000)return;S.debt+=a;S.cash+=a;toast(`Borrowed ${fmt(a)}`);commit()};

    h+=`<div class="row"><div class="n">${i&&i.name?i.name:"Slot "+n} ${act?'<span class="tag boom">Playing</span>':""}</div>
    <div class="d">${i?`${fmt(i.nw!=null?i.nw:i.cash)} net worth · ${fmt(i.cash)} cash · ${i.biz} businesses in ${i.cities} cities · ${i.sites} plots · ${i.tech} techs${i.job?" · "+i.job:""}${i.last&&!act?` · played ${fmtDur(Date.now()-i.last)} ago`:""}`:"Empty slot"}</div>
    <span style="display:flex;flex-direction:column;gap:6px;grid-row:1/3;grid-column:2">${act?`<button class="buy up" data-sv="rename" data-n="${n}">Rename</button>`:`<button class="buy" data-sv="load" data-n="${n}">${i?"Load":"New game"}</button>`}
    ${i&&!act?`<button class="buy up" data-sv="del" data-n="${n}">Delete</button>`:""}</span></div>`;
    if(act&&renaming)h+=`<div style="display:flex;gap:8px;padding:8px 0 12px"><input id="svname" maxlength="24" value="${(S.name||"").replace(/"/g,"")}" placeholder="Name this game" style="flex:1;min-width:0;font:inherit;padding:8px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink)"><button class="buy" data-sv="setname">Save</button></div>`}
  h+=`</div><p class="d" style="font-size:12px;color:var(--muted);padding:8px 0">Every slot keeps earning while you play another one, up to the usual 48 hours of offline income when you come back to it.</p>`;
  sheet.innerHTML=h;$("#cls").onclick=closeSheet}
let renaming=false;
sheet.addEventListener("click",e=>{const b=e.target.closest("[data-sv]");if(!b)return;const n=+b.dataset.n,a=b.dataset.sv;
  if(a==="load"){save();try{localStorage.setItem(SLOTKEY,String(n))}catch(e){}location.reload()}
  else if(a==="del"){if(!b.dataset.arm){b.dataset.arm=1;b.textContent="Confirm";return}try{localStorage.removeItem(slotKey(n))}catch(e){}toast(`Slot ${n} deleted`);renderSaves()}
  else if(a==="rename"){renaming=!renaming;renderSaves();const i=$("#svname");if(i)i.focus()}
  else if(a==="setname"){S.name=$("#svname").value.trim().slice(0,24)||undefined;renaming=false;save();renderSaves()}});
$("#rsbtn").onclick=()=>mode==="rs"&&sheet.classList.contains("open")?closeSheet():openResearch();
function openResearch(){mode="rs";sel=null;renderResearch();sheet.scrollTop=0;sheet.classList.add("open");draw()}
function renderResearch(){const done=TECH.filter(t=>hasTech(t.k)).length;
  let h=`<div class="shead"><div><h2>Research</h2><p>${done}/${TECH.length} technologies · ${S.sats?Math.floor(S.sats)+" satellites in orbit · ":""}${fmt(S.rp).replace("$","")} research points</p></div><button class="x" id="cls" aria-label="Close">×</button></div>
  <div class="meta"><div><span>Earning </span>${rpRate().toFixed(1)} RP/hr</div><div><span>From </span>HQ + ${S.sites.filter(x=>x.op&&OP[x.op].rp).length} labs</div></div>
  <p class="d" style="font-size:12px;color:var(--muted);margin:0 0 6px">Build research labs on industrial lots to earn points faster. Each technology costs points and cash.</p>`;
  TIERS.forEach((tn,ti)=>{h+=`<div class="sec">Tier ${["I","II","III","IV","V"][ti]} · ${tn}</div><div class="list">`;
    for(const t of TECH.filter(x=>x.t===ti)){const st=hasTech(t.k)?"done":canResearch(t)?"open":"locked",afford=S.rp>=t.rp&&S.cash>=t.cash;
      const unl=OPS.filter(o=>o.req===t.k).map(o=>o.n);
      h+=`<div class="row" style="${st==="locked"?"opacity:.55":""}"><div class="n">${st==="done"?"✓ ":""}${t.n}</div>
      <div class="d">${t.d}${st==="locked"?` <b>Needs ${(t.req||[]).filter(r=>!hasTech(r)).map(r=>TK[r].n).join(" + ")}.</b>`:""}</div>
      ${st==="done"?`<span class="tag boom" style="grid-row:1/3;grid-column:2">Done</span>`:`<button class="buy${st==="open"?"":" up"}" data-tech="${t.k}" ${st!=="open"||!afford?"disabled":""}>${Math.round(t.rp).toLocaleString()} RP<br>${fmt(t.cash)}</button>`}</div>`}
    h+=`</div>`});
  sheet.innerHTML=h;$("#cls").onclick=closeSheet;
  sheet.querySelectorAll("[data-tech]").forEach(b=>b.onclick=()=>{const t=TK[b.dataset.tech];if(!canResearch(t)||S.rp<t.rp||S.cash<t.cash)return;
    S.rp-=t.rp;S.cash-=t.cash;S.tech[t.k]=1;applyTechs();S.log.unshift(`Researched ${t.n}`);S.log=S.log.slice(0,3);
    toast(t.k==="mars"?"Mars colony established. Humanity is multi-planetary.":`Researched ${t.n}`);save();hud();renderResearch();draw()})}
function hud(){const nb=document.querySelectorAll('#needs i');["h","f","m"].forEach((k,i)=>{const v=S.need[k];nb[i].style.width=v+"%";nb[i].style.background=v<25?"var(--bad)":v<50?"var(--accent)":"var(--good)"});let{inc,nw}=totals();for(const st of S.sites){const o=siteOp(st);if(o&&!st.why)inc+=siteEst(st)+o.up*LAND[st.size][1]}$("#cash").textContent=fmt(S.cash);
  const ie=$("#inc");ie.textContent=(inc>=0?"+":"")+fmt(inc);ie.style.color=inc<0?"var(--bad)":"var(--good)";
  $("#nw").textContent=fmt(nw);$("#day").textContent=new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
  const tk=$("#ticker");if(S.log.length){const html=`<button id="tkb" aria-expanded="${!!tickOpen}" title="Show recent news">${S.log[0]}</button>`+(tickOpen?S.log.slice(1).map(l=>`<div>${l}</div>`).join(""):"");if(tk.innerHTML!==html)tk.innerHTML=html}}
let tickOpen=false;$("#ticker").addEventListener("click",e=>{if(e.target.closest("#tkb")){tickOpen=!tickOpen;hud()}});
/* bottom navigation + sheet handle */
$("#mapbtn").onclick=()=>closeSheet();
function navSync(){const open=sheet.classList.contains("open");const cur=!open?"map":mode==="pf"?"pf":mode==="rs"?"rs":mode==="sv"?"sv":"map";
  document.querySelectorAll("#nav button").forEach(b=>b.setAttribute("aria-current",String(b.dataset.nav===cur)));
  if(open)$("#hint").hidden=true}
new MutationObserver(navSync).observe(sheet,{attributes:true,attributeFilter:["class"]});
new MutationObserver(()=>{if(!sheet.firstElementChild||sheet.firstElementChild.className==="grab")return;
  const g=document.createElement("button");g.className="grab";g.setAttribute("aria-label","Drag or tap to resize the panel");sheet.prepend(g)}).observe(sheet,{childList:true});
(()=>{let y0=null,moved=false;
  sheet.addEventListener("pointerdown",e=>{if(!e.target.closest(".grab"))return;y0=e.clientY;moved=false;e.target.setPointerCapture(e.pointerId)});
  sheet.addEventListener("pointermove",e=>{if(y0==null)return;const dy=e.clientY-y0;if(Math.abs(dy)>8)moved=true;if(dy>0&&!sheet.classList.contains("full"))sheet.style.transform=`translateY(${dy}px)`});
  sheet.addEventListener("pointerup",e=>{if(y0==null)return;const dy=e.clientY-y0;y0=null;sheet.style.transform="";
    if(!moved){sheet.classList.toggle("full");return}
    if(dy<-40)sheet.classList.add("full");else if(dy>60){if(sheet.classList.contains("full"))sheet.classList.remove("full");else closeSheet()}});
  sheet.addEventListener("pointercancel",()=>{y0=null;sheet.style.transform=""})})();
const hourOf=t=>Math.floor(t/DAYMS);
function accrue(){const now=Date.now();if(!S.acc)S.acc=now;
  const dt=Math.min(now-S.acc,48*DAYMS);S.acc=now;if(S.job&&wageMult()>0)S.exp=(S.exp||0)+dt/DAYMS;runNeeds(dt/DAYMS);
  runFleet(now);const g=totals().inc*dt/DAYMS;S.cash+=g;if(g>0)S.earned=(S.earned||0)+g;const sold=runIndustry(dt/DAYMS);runTax(dt/DAYMS,now);runMarket(now);
  // run hourly world updates for every real hour boundary crossed
  if(S.hour==null)S.hour=hourOf(now);
  const h=hourOf(now),n=Math.min(h-S.hour,168);
  if(n>0){for(let i=0;i<n-1;i++)simDay(true);S.hour=h;endDay()}
  return g+sold}
let saveT=0;
setInterval(()=>{accrue();checkApp();if(++saveT%5===0){save();checkGoals()}hud();
  const sec=Math.max(0,Math.ceil(((S.hour+1)*DAYMS-Date.now())/1000));
  $("#clk").title="Next market update";$("#clk").textContent="next update "+Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0");
  if(sel&&mode==="city"&&saveT%5===0){if(tab==="biz")refreshButtons();else if(tab!=="hq"&&!shipForm&&!(document.activeElement&&/^(SELECT|INPUT)$/.test(document.activeElement.tagName)))renderSheet()}
  if(S.fleet.some(v=>v.arr))draw()},1000);
function refreshButtons(){sheet.querySelectorAll("button.buy").forEach(b=>{const m=b.textContent.match(/\$([\d.,]+)([KMB]?)/);
  if(!m||b.dataset.fixed)return;const v=parseFloat(m[1].replace(/,/g,""))*({K:1e3,M:1e6,B:1e9}[m[2]]||1);if(!b.closest(".row")||/Maxed/.test(b.textContent))return;
  if(b.id==="ads"&&S.events[sel.id]&&S.events[sel.id].m>1)return;b.disabled=S.cash<v})}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")catchUp()});

/* ---------- misc ---------- */
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),1800)}
window.addEventListener("resize",resize);
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",draw);
new MutationObserver(draw).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
/* offline: full pay for the time away, up to 48 hours */
function catchUp(){const away=Date.now()-(S.acc||Date.now());const got=accrue();
  S.last=Date.now();checkGoals();save();hud();draw();
  if(away>5*60000&&got>1){const hrs=away/DAYMS,t=hrs>=1?hrs.toFixed(1)+" h":Math.round(away/60000)+" min";
    S.log.unshift(`While you were away (${t}): ${fmt(got)} earned`);S.log=S.log.slice(0,3);hud();toast(`Welcome back · +${fmt(got)}`)}}
resize();catchUp();hud();
if(!S.log.length){S.log=["You start with nothing. Tap a city, open Jobs & home, rent a room and apply for work."];hud()}
if(!world)toast("Map outline didn't load. Cities still work.");
})();
</script>
